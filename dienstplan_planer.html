<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienstplan-Planer – Pflegeassistenz v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a5c;--navy-l:#2a5080;--navy-bg:#e8f0f8;
  --bg:#f5f6f8;--surface:#fff;--border:#dde2ea;
  --text:#1e2d3d;--muted:#6b7a8d;
  --green:#15803d;--green-bg:#dcfce7;--green-b:#86efac;
  --amber:#92400e;--amber-bg:#fef3c7;--amber-b:#fcd34d;
  --red:#be123c;--red-bg:#ffe4e6;--red-b:#fca5a5;
  --blue:#1d4ed8;--blue-bg:#dbeafe;--blue-b:#93c5fd;
  --cyan:#0e7490;--cyan-bg:#cffafe;--cyan-b:#67e8f9;
  --violet:#7c3aed;--violet-bg:#ede9fe;--violet-b:#c4b5fd;
  --r:8px;
}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}
.hdr{background:var(--navy);color:#fff;padding:0 24px;display:flex;align-items:center;gap:14px;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr h1{font-size:17px;font-weight:600;letter-spacing:-.3px;color:#fff}
.hdr .sub{font-size:11px;opacity:.6;margin-top:1px}
.hdr-sp{flex:1}.hdr-act{display:flex;gap:7px;align-items:center}
.tabs{background:var(--surface);border-bottom:2px solid var(--border);display:flex;padding:0 24px}
.tab{padding:12px 20px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--navy)}.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.main{padding:20px 24px;max-width:1600px;margin:0 auto}
.pane{display:none}.pane.on{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
.ch{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ch h2{font-size:15px;font-weight:600}.ch h3{font-size:13px;font-weight:600}
.ch-act{margin-left:auto;display:flex;gap:7px;align-items:center}
.cb{padding:16px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:var(--navy-l)}
.btn-sec{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-sec:hover{background:var(--navy-bg)}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red-b)}.btn-danger:hover{background:var(--red-bg)}
.btn-sm{padding:4px 10px;font-size:12px}.btn-xs{padding:2px 7px;font-size:11px}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=time],select,textarea{
  font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:6px 10px;width:100%;
  transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-l)}
textarea{resize:vertical;min-height:56px;font-family:'DM Mono',monospace;font-size:11px}
.row{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.field{flex:1;min-width:80px}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.chk input[type=checkbox]{width:auto;cursor:pointer}
.emp-list{display:flex;flex-direction:column;gap:8px}
.emp-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.emp-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.emp-name-lbl{font-weight:600;font-size:14px;flex:1}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:2px 5px;color:var(--muted);border-radius:4px}
.icon-btn:hover{background:var(--border);color:var(--text)}
.toggle{position:relative;width:40px;height:22px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle-sl{position:absolute;inset:0;background:var(--border);border-radius:11px;cursor:pointer;transition:.2s}
.toggle-sl:before{content:'';position:absolute;width:18px;height:18px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked + .toggle-sl{background:var(--navy)}
.toggle input:checked + .toggle-sl:before{transform:translateX(18px)}
.toggle-wrap{display:flex;align-items:center;gap:8px;font-size:13px}
.sep{height:1px;background:var(--border);margin:12px 0}
.alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px}
.alert-info{background:var(--blue-bg);border:1px solid var(--blue-b);color:var(--blue)}
.alert-warn{background:var(--amber-bg);border:1px solid var(--amber-b);color:var(--amber)}
.alert-err{background:var(--red-bg);border:1px solid var(--red-b);color:var(--red)}
.cal-wrap{overflow-x:auto}
.cal-tbl{border-collapse:collapse;width:100%;font-size:12px}
.cal-tbl th{background:var(--navy-bg);color:var(--navy);font-size:11px;font-weight:600;padding:5px 8px;text-align:left;border:1px solid var(--border);white-space:nowrap}
.cal-tbl td{border:1px solid var(--border);padding:3px 6px;vertical-align:middle}
.mono{font-family:'DM Mono',monospace}
.muted-cell{color:var(--muted);font-style:italic}
.r-norm{background:#fff}.r-we{background:#f8f9fb}.r-hol{background:var(--amber-bg)}
.r-werk{background:var(--cyan-bg)}.r-frei{background:var(--green-bg)}
.r-werk-b{background:#e0f7fa}.r-frei-b{background:#d4edda}
.td-day{font-weight:700;font-size:13px;text-align:center;min-width:24px}
.td-date{min-width:85px;white-space:nowrap;font-size:11px}
.td-shift{min-width:155px;font-size:11px;color:var(--muted)}
.td-emp{min-width:120px}
.emp-sel{width:100%;font-size:11px;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:#fff;font-family:'DM Sans',sans-serif}
.td-vac{min-width:80px;font-size:10px;color:var(--muted)}
.td-hints{min-width:90px}
.viol{display:inline-block;background:var(--red-bg);color:var(--red);border:1px solid var(--red-b);border-radius:3px;padding:0 4px;font-size:10px;font-weight:600;margin:1px}
.hint-warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
.hint-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-b)}
.sum-tbl{border-collapse:collapse;width:100%;font-size:13px}
.sum-tbl th{background:var(--navy-bg);color:var(--navy);padding:7px 10px;text-align:left;border:1px solid var(--border);font-size:12px;white-space:nowrap}
.sum-tbl td{border:1px solid var(--border);padding:6px 10px;vertical-align:middle}
.sum-tbl tr:hover td{background:var(--navy-bg)}
.sum-ok{color:var(--green);font-weight:600}.sum-warn{color:var(--amber);font-weight:600}.sum-err{color:var(--red);font-weight:600}
.wt-days-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.wt-times-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.wt-time-box{border:1px solid var(--cyan-b);border-radius:6px;padding:8px;background:#fff}
.wt-time-box label{color:var(--cyan);font-size:11px;margin-bottom:4px}
@media print{
  body{background:#fff;font-size:10px}
  .hdr,.tabs,.btn,.ch-act,#pane-settings,#pane-summary,
  .pane:not(.on){display:none!important}
  .main{padding:2mm;max-width:none}
  .card{box-shadow:none;border:none;margin:0}
  .ch{padding:3px 6px}
  .cb{padding:3px 0}
  .cal-tbl{font-size:8.5px}
  .cal-tbl td,.cal-tbl th{padding:2px 3px}
  .emp-sel{border:none;background:transparent;font-size:8.5px;padding:0;-webkit-appearance:none}
  .td-emp{min-width:70px}.td-shift{min-width:100px}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>📋 Dienstplan-Planer</h1>
    <div class="sub">Pflegeassistenz-Vorplanung v5</div>
  </div>
  <div class="hdr-sp"></div>
  <div class="hdr-act">
    <button class="btn btn-sec btn-sm" onclick="exportJSON()">⬇ Export</button>
    <label class="btn btn-sec btn-sm" style="cursor:pointer;margin:0">⬆ Import<input type="file" accept=".json" style="display:none" onchange="importJSON(event)"></label>
    <button class="btn btn-sec btn-sm" onclick="window.print()">🖨 Drucken</button>
  </div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="settings" onclick="switchTab('settings')">⚙ Einstellungen</button>
  <button class="tab" data-tab="plan" onclick="switchTab('plan')">📅 Planung</button>
  <button class="tab" data-tab="summary" onclick="switchTab('summary')">📊 Übersicht</button>
</div>

<div class="main">

<!-- EINSTELLUNGEN -->
<div id="pane-settings" class="pane on">

  <div class="card">
    <div class="ch"><h2>📅 Planungszeitraum</h2></div>
    <div class="cb">
      <div class="row">
        <div class="field" style="max-width:110px"><label>Jahr</label>
          <input type="number" id="inp-year" min="2024" max="2030" onchange="saveSettings()"></div>
        <div class="field" style="max-width:160px"><label>Monat</label>
          <select id="inp-month" onchange="saveSettings()">
            <option value="1">Januar</option><option value="2">Februar</option><option value="3">März</option>
            <option value="4">April</option><option value="5">Mai</option><option value="6">Juni</option>
            <option value="7">Juli</option><option value="8">August</option><option value="9">September</option>
            <option value="10">Oktober</option><option value="11">November</option><option value="12">Dezember</option>
          </select>
        </div>
        <div class="field" style="max-width:130px"><label>Übergabe-Zeit</label>
          <input type="time" id="inp-handover" onchange="saveSettings()"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="ch"><h2>🌙 Normaltag (24h-Dienst)</h2></div>
    <div class="cb">
      <div class="row">
        <div class="field"><label>Bezeichnung</label>
          <input type="text" id="nt-name" placeholder="z.B. 24h-Dienst" onchange="saveSettings()"></div>
        <div class="field" style="max-width:120px"><label>Beginn</label>
          <input type="time" id="nt-start" onchange="saveSettings()"></div>
        <div class="field" style="max-width:120px"><label>Ende (nächster Tag)</label>
          <input type="time" id="nt-end" onchange="saveSettings()"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="ch">
      <h2>🔧 Werkstatttag</h2>
      <div class="ch-act">
        <label class="toggle-wrap">
          <label class="toggle"><input type="checkbox" id="wk-enabled" onchange="saveSettings()"><span class="toggle-sl"></span></label>
          <span id="wk-lbl">Deaktiviert</span>
        </label>
      </div>
    </div>
    <div class="cb" id="wk-cfg" style="display:none">
      <label>Aktive Wochentage (Block A = Werkstatt, Block B = Außerhalb)</label>
      <div class="wt-days-grid" id="wk-days">
        <label class="chk"><input type="checkbox" class="wk-day" value="1" onchange="saveSettings()"> Mo</label>
        <label class="chk"><input type="checkbox" class="wk-day" value="2" onchange="saveSettings()"> Di</label>
        <label class="chk"><input type="checkbox" class="wk-day" value="3" onchange="saveSettings()"> Mi</label>
        <label class="chk"><input type="checkbox" class="wk-day" value="4" onchange="saveSettings()"> Do</label>
        <label class="chk"><input type="checkbox" class="wk-day" value="5" onchange="saveSettings()"> Fr</label>
        <label class="chk"><input type="checkbox" class="wk-day" value="6" onchange="saveSettings()"> Sa</label>
        <label class="chk"><input type="checkbox" class="wk-day" value="0" onchange="saveSettings()"> So</label>
      </div>
      <div class="wt-times-grid" id="wk-times"></div>
    </div>
  </div>

  <div class="card">
    <div class="ch">
      <h2>🌿 Freischicht-Tag</h2>
      <div class="ch-act">
        <label class="toggle-wrap">
          <label class="toggle"><input type="checkbox" id="fs-enabled" onchange="saveSettings()"><span class="toggle-sl"></span></label>
          <span id="fs-lbl">Deaktiviert</span>
        </label>
      </div>
    </div>
    <div class="cb" id="fs-cfg" style="display:none">
      <label>Aktive Wochentage (Block A = Freischicht leer, Block B = Rest-Dienst)</label>
      <div class="wt-days-grid">
        <label class="chk"><input type="checkbox" class="fs-day" value="1" onchange="saveSettings()"> Mo</label>
        <label class="chk"><input type="checkbox" class="fs-day" value="2" onchange="saveSettings()"> Di</label>
        <label class="chk"><input type="checkbox" class="fs-day" value="3" onchange="saveSettings()"> Mi</label>
        <label class="chk"><input type="checkbox" class="fs-day" value="4" onchange="saveSettings()"> Do</label>
        <label class="chk"><input type="checkbox" class="fs-day" value="5" onchange="saveSettings()"> Fr</label>
        <label class="chk"><input type="checkbox" class="fs-day" value="6" onchange="saveSettings()"> Sa</label>
        <label class="chk"><input type="checkbox" class="fs-day" value="0" onchange="saveSettings()"> So</label>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="field" style="max-width:130px"><label>Block A Beginn</label>
          <input type="time" id="fs-start" onchange="saveSettings()"></div>
        <div class="field" style="max-width:130px"><label>Block A Ende</label>
          <input type="time" id="fs-end" onchange="saveSettings()"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="ch">
      <h2>👥 Mitarbeiter</h2>
      <div class="ch-act"><button class="btn btn-primary btn-sm" onclick="addEmployee()">+ Hinzufügen</button></div>
    </div>
    <div class="cb">
      <div class="emp-list" id="emp-list"></div>
    </div>
  </div>

  <div class="card">
    <div class="ch"><h2>🖨 Druckeinstellungen</h2></div>
    <div class="cb">
      <div class="row">
        <div class="field"><label>Erstellt von</label>
          <input type="text" id="print-author" placeholder="Name" onchange="saveSettings()"></div>
        <div class="field" style="flex:2"><label>Zusatzinfo</label>
          <input type="text" id="print-extra" placeholder="z.B. Entwurf zur Abstimmung" onchange="saveSettings()"></div>
      </div>
    </div>
  </div>

</div><!-- /pane-settings -->

<!-- PLANUNG -->
<div id="pane-plan" class="pane">
  <div class="card">
    <div class="ch">
      <h2 id="plan-title">Dienstplan</h2>
      <div class="ch-act">
        <button class="btn btn-primary" onclick="generatePlan()">▶ Generieren</button>
        <button class="btn btn-sec btn-sm" onclick="clearPlan()">✕ Leeren</button>
      </div>
    </div>
    <div class="cb" id="plan-body">
      <div class="alert alert-info">Plan generieren, um den Kalender anzuzeigen.</div>
    </div>
  </div>
</div><!-- /pane-plan -->

<!-- ÜBERSICHT -->
<div id="pane-summary" class="pane">
  <div class="card">
    <div class="ch"><h2>📊 Mitarbeiterübersicht</h2></div>
    <div class="cb" id="summary-body">
      <div class="alert alert-info">Bitte zuerst einen Plan generieren.</div>
    </div>
  </div>
</div><!-- /pane-summary -->

</div><!-- /main -->

<script>
// =====================================================================
// CONSTANTS
// =====================================================================
const SKEY = 'dp_v5_st';
const PKEY = 'dp_v5_plan';
const DOW_SHORT = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const DOW_FULL  = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON_NAMES = ['','Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

const HOLS = {
  2025:{
    '2025-01-01':'Neujahr','2025-04-18':'Karfreitag','2025-04-21':'Ostermontag',
    '2025-05-01':'Tag der Arbeit','2025-05-29':'Christi Himmelfahrt',
    '2025-06-09':'Pfingstmontag','2025-06-19':'Fronleichnam',
    '2025-10-03':'Tag d. dt. Einheit','2025-11-01':'Allerheiligen',
    '2025-12-25':'1. Weihnachtstag','2025-12-26':'2. Weihnachtstag'
  },
  2026:{
    '2026-01-01':'Neujahr','2026-04-03':'Karfreitag','2026-04-06':'Ostermontag',
    '2026-05-01':'Tag der Arbeit','2026-05-14':'Christi Himmelfahrt',
    '2026-05-25':'Pfingstmontag','2026-06-04':'Fronleichnam',
    '2026-10-03':'Tag d. dt. Einheit','2026-11-01':'Allerheiligen',
    '2026-12-25':'1. Weihnachtstag','2026-12-26':'2. Weihnachtstag'
  },
  2027:{
    '2027-01-01':'Neujahr','2027-03-26':'Karfreitag','2027-03-29':'Ostermontag',
    '2027-05-01':'Tag der Arbeit','2027-05-06':'Christi Himmelfahrt',
    '2027-05-17':'Pfingstmontag','2027-05-27':'Fronleichnam',
    '2027-10-03':'Tag d. dt. Einheit','2027-11-01':'Allerheiligen',
    '2027-12-25':'1. Weihnachtstag','2027-12-26':'2. Weihnachtstag'
  }
};

// =====================================================================
// STATE
// =====================================================================
function defaultST() {
  const now = new Date();
  return {
    year: now.getFullYear(), month: now.getMonth()+1,
    handoverTime:'08:00',
    normaltag:{ name:'24h-Dienst', start:'20:00', end:'20:00' },
    werkstatt:{ enabled:false, activeDays:[], dayConfig:{} },
    freischicht:{ enabled:false, activeDays:[], start:'08:00', end:'12:00' },
    employees:[], printExtra:'', printAuthor:''
  };
}
let ST = defaultST();
let PLAN = null;

function loadState() {
  try {
    const s = localStorage.getItem(SKEY);
    if (s) ST = Object.assign(defaultST(), JSON.parse(s));
    const p = localStorage.getItem(PKEY);
    if (p) PLAN = JSON.parse(p);
  } catch(e){ console.error(e); }
}
function saveST() { localStorage.setItem(SKEY, JSON.stringify(ST)); }
function savePlan() { if(PLAN) localStorage.setItem(PKEY, JSON.stringify(PLAN)); else localStorage.removeItem(PKEY); }

// =====================================================================
// UTILS
// =====================================================================
function pad2(n){ return String(n).padStart(2,'0'); }
function fmtDate(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dowOf(ds){ return new Date(ds+'T12:00:00').getDay(); }
function holName(ds){ return (HOLS[ST.year]||{})[ds]||''; }
function isHol(ds){ return !!holName(ds); }

function isoWeek(ds){
  const d = new Date(ds+'T12:00:00');
  const day = d.getDay()||7;
  d.setDate(d.getDate()+4-day);
  const y1 = new Date(d.getFullYear(),0,1);
  return `${d.getFullYear()}-W${Math.ceil(((d-y1)/86400000+1)/7)}`;
}

function empName(id){
  if(id===null||id===undefined) return '–';
  const e = ST.employees.find(x=>x.id===id);
  return e ? e.name : '?';
}

function parsePrefDow(text){
  if(!text) return null;
  const t = text.toLowerCase();
  const map = {' mo':1,' di':2,' mi':3,' do':4,' fr':5,' sa':6,' so':0,
               '^mo':1,'^di':2,'^mi':3,'^do':4,'^fr':5,'^sa':6,'^so':0};
  const keys2 = ['mo','di','mi','do','fr','sa','so'];
  const vals2  = [1,2,3,4,5,6,0];
  for(let i=0;i<keys2.length;i++){
    if(t.includes(keys2[i])) return vals2[i];
  }
  return null;
}

// =====================================================================
// ALGORITHM — canAssign helpers
// =====================================================================
function hA(asgn,i){ return !!(asgn[i]&&asgn[i].hasAssist); }
function hB(asgn,i){ return !!(asgn[i]&&asgn[i].hasBelegt); }

function canAssignDienst(empId, di, ed){
  const a = ed[empId].asgn;
  if(hA(a,di-1)) return {ok:false,rule:'H2',msg:'Dienst Vortag'};
  if(hA(a,di+1)) return {ok:false,rule:'H2',msg:'Dienst Folgetag'};
  if(hB(a,di-1)&&hB(a,di-2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di-1)&&hB(a,di+1)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di+1)&&hB(a,di+2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hA(a,di-2)&&hB(a,di-1)) return {ok:false,rule:'H4',msg:'D-B-D'};
  if(hB(a,di+1)&&hA(a,di+2)) return {ok:false,rule:'H4',msg:'D-B-D'};
  return {ok:true};
}
function canAssignBackup(empId, di, ed){
  const a = ed[empId].asgn;
  if(hB(a,di-1)&&hB(a,di-2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di-1)&&hB(a,di+1)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di+1)&&hB(a,di+2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(a[di]&&a[di].hasAssist) return {ok:false,rule:'H5',msg:'Bereits Assistent'};
  return {ok:true};
}
function canAssignWerkABackup(empId, di, ed){
  // H3 only — no H5 (werkstatt exception)
  const a = ed[empId].asgn;
  if(hB(a,di-1)&&hB(a,di-2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di-1)&&hB(a,di+1)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di+1)&&hB(a,di+2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  return {ok:true};
}
function canAssignWerkBDienst(empId, di, ed){
  const a = ed[empId].asgn;
  if(hA(a,di-1)) return {ok:false,rule:'H2',msg:'Dienst Vortag'};
  if(hA(a,di+1)) return {ok:false,rule:'H2',msg:'Dienst Folgetag'};
  if(hB(a,di-1)&&hB(a,di-2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di-1)&&hB(a,di+1)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di+1)&&hB(a,di+2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hA(a,di-2)&&hB(a,di-1)) return {ok:false,rule:'H4',msg:'D-B-D'};
  if(hB(a,di+1)&&hA(a,di+2)) return {ok:false,rule:'H4',msg:'D-B-D'};
  if(a[di]&&a[di].hasWBBkp) return {ok:false,rule:'H5',msg:'Bereits WB-Backup'};
  return {ok:true};
}
function canAssignWerkBBackup(empId, di, ed){
  const a = ed[empId].asgn;
  if(hB(a,di-1)&&hB(a,di-2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di-1)&&hB(a,di+1)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(hB(a,di+1)&&hB(a,di+2)) return {ok:false,rule:'H3',msg:'3 Tage'};
  if(a[di]&&a[di].hasWBDienst) return {ok:false,rule:'H5',msg:'Bereits WB-Dienst'};
  return {ok:true};
}

// =====================================================================
// ALGORITHM — record helpers
// =====================================================================
function recAssist(day, empId, ed, kind){
  const di=day.idx, e=ed[empId];
  if(!e.asgn[di]) e.asgn[di]={};
  e.asgn[di].hasAssist=true; e.asgn[di].hasBelegt=true;
  if(kind==='werkB') e.asgn[di].hasWBDienst=true;
  e.lastDay=di;
  const wk=isoWeek(day.dateStr);
  e.weekCounts[wk]=(e.weekCounts[wk]||0)+1;
  if(kind==='24h') e.cnt24h++; else e.cntAusser++;
}
function recBackup(day, empId, ed, kind){
  const di=day.idx, e=ed[empId];
  if(!e.asgn[di]) e.asgn[di]={};
  e.asgn[di].hasBelegt=true;
  if(kind==='werkA'){ e.asgn[di].isWABkp=true; e.cntBkpWerk++; }
  else { if(kind==='werkB') e.asgn[di].hasWBBkp=true; e.cntBkpReg++; }
  e.lastDay=di;
}

// =====================================================================
// ALGORITHM — build structures
// =====================================================================
function buildDays(){
  const n=daysInMonth(ST.year,ST.month), days=[];
  for(let d=1;d<=n;d++){
    const ds=fmtDate(ST.year,ST.month,d);
    const dow=dowOf(ds);
    let type='normaltag';
    if(ST.werkstatt.enabled && ST.werkstatt.activeDays.includes(dow)) type='werkstatt';
    else if(ST.freischicht.enabled && ST.freischicht.activeDays.includes(dow)) type='freischicht';
    const day={idx:d-1, dayNum:d, dateStr:ds, dow, type,
               isHol:isHol(ds), holName:holName(ds), hardViol:[], manualOverride:false};
    if(type==='normaltag'){
      day.normal={dienst:null,backup:null};
    } else if(type==='werkstatt'){
      const cfg=ST.werkstatt.dayConfig[dow]||{start:'08:00',end:'15:00'};
      day.werkA={start:cfg.start,end:cfg.end,backup:null};
      day.werkB={start:cfg.end,end:cfg.start,dienst:null,backup:null};
    } else {
      day.freieA={start:ST.freischicht.start,end:ST.freischicht.end};
      day.freieB={start:ST.freischicht.end,end:ST.freischicht.start,dienst:null,backup:null};
    }
    days.push(day);
  }
  return days;
}

function buildEd(){
  const ed={};
  for(const emp of ST.employees){
    ed[emp.id]={
      vacSet:new Set(emp.vacations||[]),
      blkSet:new Set(emp.blockDays||[]),
      asgn:{}, cnt24h:0, cntAusser:0, cntBkpReg:0, cntBkpWerk:0,
      weekCounts:{}, lastDay:-1
    };
  }
  return ed;
}

function available(emp, day, ed){
  const e=ed[emp.id];
  return !e.vacSet.has(day.dateStr) && !e.blkSet.has(day.dateStr);
}

function weekOk(empId, day, ed){
  const wk=isoWeek(day.dateStr);
  return (ed[empId].weekCounts[wk]||0)<2;
}

// Pick best candidate from empIds list based on soft rules
function pickBest(empIds, ed, isAusserhalb){
  return empIds.slice().sort((a,b)=>{
    const ea=ed[a], eb=ed[b];
    const empa=ST.employees.find(e=>e.id===a);
    const empb=ST.employees.find(e=>e.id===b);
    const totA=ea.cnt24h+ea.cntAusser, totB=eb.cnt24h+eb.cntAusser;
    const defA=(empa.target||8)-totA, defB=(empb.target||8)-totB;
    if(defB!==defA) return defB-defA;
    const prefA=isAusserhalb===(empa.prefShift==='ausserhalb')?1:0;
    const prefB=isAusserhalb===(empb.prefShift==='ausserhalb')?1:0;
    if(prefB!==prefA) return prefB-prefA;
    return (ea.lastDay||0)-(eb.lastDay||0);
  })[0];
}
function pickBestBackup(empIds, ed){
  return empIds.slice().sort((a,b)=>{
    const ea=ed[a], eb=ed[b];
    const defA=(ea.cntBkpReg||0), defB=(eb.cntBkpReg||0);
    if(defA!==defB) return defA-defB;
    return (ea.lastDay||0)-(eb.lastDay||0);
  })[0];
}
function pickBestWABackup(empIds, ed){
  return empIds.slice().sort((a,b)=>{
    const ea=ed[a], eb=ed[b];
    if(ea.cntBkpWerk!==eb.cntBkpWerk) return ea.cntBkpWerk-eb.cntBkpWerk;
    return (ea.lastDay||0)-(eb.lastDay||0);
  })[0];
}

// =====================================================================
// ALGORITHM — phases
// =====================================================================
function phase1(days, ed){
  for(const emp of ST.employees){
    const pref=parsePrefDow(emp.extraConstraints||'');
    if(pref===null) continue;
    const e=ed[emp.id];
    const target=emp.target||8;
    for(const day of days){
      if(e.cnt24h+e.cntAusser>=target) break;
      if(day.dow!==pref) continue;
      if(!available(emp,day,ed)) continue;
      if(!weekOk(emp.id,day,ed)) continue;
      if(day.type==='normaltag'){
        if(day.normal.dienst!==null) continue;
        if(!canAssignDienst(emp.id,day.idx,ed).ok) continue;
        day.normal.dienst=emp.id;
        recAssist(day,emp.id,ed,'24h');
      } else if(day.type==='werkstatt'){
        if(day.werkB.dienst!==null) continue;
        if(!canAssignWerkBDienst(emp.id,day.idx,ed).ok) continue;
        day.werkB.dienst=emp.id;
        recAssist(day,emp.id,ed,'werkB');
      } else {
        if(day.freieB.dienst!==null) continue;
        if(!canAssignDienst(emp.id,day.idx,ed).ok) continue;
        day.freieB.dienst=emp.id;
        recAssist(day,emp.id,ed,'aus');
      }
    }
  }
}

function phase2(days, ed){
  for(const day of days){
    let slot, assignFn, canFn, kind;
    if(day.type==='normaltag'){
      if(day.normal.dienst!==null) continue;
      canFn=canAssignDienst; kind='24h';
      const cands=ST.employees.filter(emp=>{
        return available(emp,day,ed) && weekOk(emp.id,day,ed) && canFn(emp.id,day.idx,ed).ok;
      }).map(e=>e.id);
      const best=pickBest(cands,ed,false);
      if(best!==undefined){ day.normal.dienst=best; recAssist(day,best,ed,'24h'); }
    } else if(day.type==='werkstatt'){
      if(day.werkB.dienst!==null) continue;
      const cands=ST.employees.filter(emp=>{
        return available(emp,day,ed) && weekOk(emp.id,day,ed) && canAssignWerkBDienst(emp.id,day.idx,ed).ok;
      }).map(e=>e.id);
      const best=pickBest(cands,ed,true);
      if(best!==undefined){ day.werkB.dienst=best; recAssist(day,best,ed,'werkB'); }
    } else {
      if(day.freieB.dienst!==null) continue;
      const cands=ST.employees.filter(emp=>{
        return available(emp,day,ed) && weekOk(emp.id,day,ed) && canAssignDienst(emp.id,day.idx,ed).ok;
      }).map(e=>e.id);
      const best=pickBest(cands,ed,true);
      if(best!==undefined){ day.freieB.dienst=best; recAssist(day,best,ed,'aus'); }
    }
  }
}

function phase3A(days, ed){
  for(const day of days){
    if(day.type!=='werkstatt') continue;
    if(day.werkA.backup!==null) continue;
    const cands=ST.employees.filter(emp=>{
      return available(emp,day,ed) && canAssignWerkABackup(emp.id,day.idx,ed).ok;
    }).map(e=>e.id);
    const best=pickBestWABackup(cands,ed);
    if(best!==undefined){ day.werkA.backup=best; recBackup(day,best,ed,'werkA'); }
  }
}

function phase3B(days, ed){
  for(const day of days){
    if(day.type==='normaltag'){
      if(day.normal.backup!==null) continue;
      const cands=ST.employees.filter(emp=>{
        return available(emp,day,ed) && canAssignBackup(emp.id,day.idx,ed).ok;
      }).map(e=>e.id);
      const best=pickBestBackup(cands,ed);
      if(best!==undefined){ day.normal.backup=best; recBackup(day,best,ed,'reg'); }
    } else if(day.type==='werkstatt'){
      if(day.werkB.backup!==null) continue;
      const cands=ST.employees.filter(emp=>{
        return available(emp,day,ed) && canAssignWerkBBackup(emp.id,day.idx,ed).ok;
      }).map(e=>e.id);
      const best=pickBestBackup(cands,ed);
      if(best!==undefined){ day.werkB.backup=best; recBackup(day,best,ed,'werkB'); }
    } else {
      if(day.freieB.backup!==null) continue;
      const cands=ST.employees.filter(emp=>{
        return available(emp,day,ed) && canAssignBackup(emp.id,day.idx,ed).ok;
      }).map(e=>e.id);
      const best=pickBestBackup(cands,ed);
      if(best!==undefined){ day.freieB.backup=best; recBackup(day,best,ed,'reg'); }
    }
  }
}

function validatePlan(days, ed){
  // Rebuild asgn for validation from final plan
  const asgn2={};
  for(const emp of ST.employees) asgn2[emp.id]=[];
  for(const day of days){
    const di=day.idx;
    function mark(id,role){
      if(!id||id===null) return;
      if(!asgn2[id]) asgn2[id]=[];
      asgn2[id][di]=(asgn2[id][di]||'')+role;
    }
    if(day.type==='normaltag'){ mark(day.normal.dienst,'D'); mark(day.normal.backup,'B'); }
    else if(day.type==='werkstatt'){ mark(day.werkA.backup,'WA'); mark(day.werkB.dienst,'D'); mark(day.werkB.backup,'B'); }
    else { mark(day.freieB.dienst,'D'); mark(day.freieB.backup,'B'); }
  }
  // Check hard rules on final plan
  for(const day of days){
    day.hardViol=[];
    const check=(id,label)=>{
      if(!id) return;
      const di=day.idx;
      const arr=asgn2[id]||[];
      const isD=s=>s&&(s.includes('D'));
      const isAny=s=>!!(s);
      if(isD(arr[di])){
        if(isD(arr[di-1])) day.hardViol.push({rule:'H2',emp:empName(id),msg:'Dienst Vortag'});
        if(isD(arr[di+1])) day.hardViol.push({rule:'H2',emp:empName(id),msg:'Dienst Folgetag'});
        if(isAny(arr[di-1])&&isAny(arr[di-2])) day.hardViol.push({rule:'H3',emp:empName(id),msg:'3 Tage'});
        if(isD(arr[di-2])&&isAny(arr[di-1])) day.hardViol.push({rule:'H4',emp:empName(id),msg:'D-B-D'});
      }
    };
    if(day.type==='normaltag'){ check(day.normal.dienst,'D'); }
    else if(day.type==='werkstatt'){ check(day.werkB.dienst,'D'); }
    else { check(day.freieB.dienst,'D'); }
  }
}

// =====================================================================
// MAIN GENERATE
// =====================================================================
function generatePlan(){
  if(ST.employees.length===0){
    alert('Bitte zuerst Mitarbeiter anlegen.');
    return;
  }
  const days=buildDays();
  const ed=buildEd();
  phase1(days,ed);
  phase2(days,ed);
  phase3A(days,ed);
  phase3B(days,ed);
  validatePlan(days,ed);
  // Store summary stats on plan
  PLAN={days, stats:summarizeStats(days,ed), generated:new Date().toLocaleString('de-DE')};
  savePlan();
  renderCalendar();
  renderSummary();
}

function summarizeStats(days, ed){
  const stats={};
  for(const emp of ST.employees){
    const e=ed[emp.id];
    stats[emp.id]={
      cnt24h:e.cnt24h, cntAusser:e.cntAusser,
      cntBkpReg:e.cntBkpReg, cntBkpWerk:e.cntBkpWerk,
      vacCount:(emp.vacations||[]).filter(ds=>{
        const d=new Date(ds+'T12:00:00');
        return d.getFullYear()===ST.year && d.getMonth()+1===ST.month;
      }).length,
      blkCount:(emp.blockDays||[]).filter(ds=>{
        const d=new Date(ds+'T12:00:00');
        return d.getFullYear()===ST.year && d.getMonth()+1===ST.month;
      }).length
    };
  }
  return stats;
}

function clearPlan(){
  if(!confirm('Plan wirklich löschen?')) return;
  PLAN=null; savePlan();
  document.getElementById('plan-body').innerHTML=
    '<div class="alert alert-info">Plan generieren, um den Kalender anzuzeigen.</div>';
  document.getElementById('summary-body').innerHTML=
    '<div class="alert alert-info">Bitte zuerst einen Plan generieren.</div>';
}

function manualEdit(ds, block, field, val){
  if(!PLAN) return;
  const day=PLAN.days.find(d=>d.dateStr===ds);
  if(!day) return;
  const empId = val==='' ? null : parseInt(val);
  if(block==='normal') day.normal[field]=empId;
  else if(block==='werkA') day.werkA[field]=empId;
  else if(block==='werkB') day.werkB[field]=empId;
  else if(block==='freieB') day.freieB[field]=empId;
  day.manualOverride=true;
  savePlan();
}

// =====================================================================
// CALENDAR RENDER
// =====================================================================
function empOpts(day, selId, block, field){
  const ds=day.dateStr;
  const vacSet=new Set(), blkSet=new Set();
  for(const emp of ST.employees){
    if((emp.vacations||[]).includes(ds)) vacSet.add(emp.id);
    if((emp.blockDays||[]).includes(ds)) blkSet.add(emp.id);
  }
  let opts=`<option value="">– frei –</option>`;
  for(const emp of ST.employees){
    const sel=selId===emp.id?' selected':'';
    const suffix=vacSet.has(emp.id)?' (Urlaub)':blkSet.has(emp.id)?' (Sperr)':'';
    opts+=`<option value="${emp.id}"${sel}>${emp.name}${suffix}</option>`;
  }
  return `<select class="emp-sel" onchange="manualEdit('${ds}','${block}','${field}',this.value)">${opts}</select>`;
}

function vacCell(day){
  const parts=[];
  for(const emp of ST.employees){
    if((emp.vacations||[]).includes(day.dateStr)) parts.push(emp.name);
  }
  return parts.join(', ')||'';
}
function blkCell(day){
  const parts=[];
  for(const emp of ST.employees){
    if((emp.blockDays||[]).includes(day.dateStr)) parts.push(emp.name);
  }
  return parts.join(', ')||'';
}

function rowClass(day){
  if(day.isHol) return 'r-hol';
  if(day.dow===0||day.dow===6) return 'r-we';
  if(day.type==='werkstatt') return 'r-werk';
  if(day.type==='freischicht') return 'r-frei';
  return 'r-norm';
}
function rowClassB(day){
  if(day.isHol) return 'r-hol';
  if(day.dow===0||day.dow===6) return 'r-we';
  if(day.type==='werkstatt') return 'r-werk-b';
  return 'r-frei-b';
}

function violBadges(day){
  return day.hardViol.map(v=>
    `<span class="viol">${v.rule} ${v.emp}</span>`
  ).join('');
}
function manualBadge(day){
  return day.manualOverride ? '<span class="viol hint-warn" title="Manuell geändert">✎</span>' : '';
}

function renderCalendar(){
  if(!PLAN) return;
  const days=PLAN.days;
  let vcount=days.reduce((s,d)=>s+d.hardViol.length,0);
  let hdr=`<b>${MON_NAMES[ST.month]} ${ST.year}</b>`;
  if(PLAN.generated) hdr+=` <span style="font-size:11px;color:var(--muted)">Generiert: ${PLAN.generated}</span>`;
  if(ST.printAuthor) hdr+=` <span style="font-size:11px;color:var(--muted)">– ${ST.printAuthor}</span>`;
  if(ST.printExtra) hdr+=` <span style="font-size:11px;color:var(--muted)">| ${ST.printExtra}</span>`;

  let warn='';
  if(vcount>0) warn=`<div class="alert alert-warn" style="margin-bottom:10px">⚠ ${vcount} Regelverstoß${vcount===1?'':'verstöße'} im Plan – bitte prüfen.</div>`;

  let tbl=`<table class="cal-tbl">
<thead><tr>
  <th>Tag</th><th>Datum</th><th>Schicht</th>
  <th>Assistent</th><th>Backup</th>
  <th>Urlaube</th><th>Sperrtage</th><th>Hinweise</th>
</tr></thead><tbody>`;

  for(const day of days){
    const rc=rowClass(day);
    const vc=vacCell(day);
    const bc=blkCell(day);
    const dow=DOW_SHORT[day.dow];
    const dateDisp=`${pad2(day.dayNum)}.${pad2(ST.month)}. <b>${dow}</b>${day.isHol?`<br><span style="font-size:9px;color:var(--amber)">${day.holName}</span>`:''}`;
    const viols=violBadges(day)+manualBadge(day);

    if(day.type==='normaltag'){
      const shift=`${ST.normaltag.name} ${ST.normaltag.start}–${ST.normaltag.end} (+1)`;
      tbl+=`<tr class="${rc}">
  <td class="td-day mono">${day.dayNum}</td>
  <td class="td-date">${dateDisp}</td>
  <td class="td-shift">${shift}</td>
  <td class="td-emp">${empOpts(day,day.normal.dienst,'normal','dienst')}</td>
  <td class="td-emp">${empOpts(day,day.normal.backup,'normal','backup')}</td>
  <td class="td-vac">${vc}</td>
  <td class="td-vac">${bc}</td>
  <td class="td-hints">${viols}</td>
</tr>`;
    } else if(day.type==='werkstatt'){
      const shiftA=`🔧 Werkstatt ${day.werkA.start}–${day.werkA.end}`;
      const shiftB=`🔧 Außerhalb ${day.werkB.start}–${day.werkB.end} (+1)`;
      tbl+=`<tr class="${rc}">
  <td class="td-day mono" rowspan="2">${day.dayNum}</td>
  <td class="td-date" rowspan="2">${dateDisp}</td>
  <td class="td-shift">${shiftA}</td>
  <td class="td-emp muted-cell">– (kein Assistent) –</td>
  <td class="td-emp">${empOpts(day,day.werkA.backup,'werkA','backup')}</td>
  <td class="td-vac" rowspan="2">${vc}</td>
  <td class="td-vac" rowspan="2">${bc}</td>
  <td class="td-hints" rowspan="2">${viols}</td>
</tr>
<tr class="${rowClassB(day)}">
  <td class="td-shift">${shiftB}</td>
  <td class="td-emp">${empOpts(day,day.werkB.dienst,'werkB','dienst')}</td>
  <td class="td-emp">${empOpts(day,day.werkB.backup,'werkB','backup')}</td>
</tr>`;
    } else {
      const shiftA=`🌿 Freischicht ${day.freieA.start}–${day.freieA.end}`;
      const shiftB=`🌿 Rest ${day.freieB.start}–${day.freieB.end} (+1)`;
      tbl+=`<tr class="${rc}">
  <td class="td-day mono" rowspan="2">${day.dayNum}</td>
  <td class="td-date" rowspan="2">${dateDisp}</td>
  <td class="td-shift">${shiftA}</td>
  <td class="td-emp muted-cell">– frei –</td>
  <td class="td-emp muted-cell">–</td>
  <td class="td-vac" rowspan="2">${vc}</td>
  <td class="td-vac" rowspan="2">${bc}</td>
  <td class="td-hints" rowspan="2">${viols}</td>
</tr>
<tr class="${rowClassB(day)}">
  <td class="td-shift">${shiftB}</td>
  <td class="td-emp">${empOpts(day,day.freieB.dienst,'freieB','dienst')}</td>
  <td class="td-emp">${empOpts(day,day.freieB.backup,'freieB','backup')}</td>
</tr>`;
    }
  }

  tbl+='</tbody></table>';
  document.getElementById('plan-body').innerHTML=warn+`<p style="margin-bottom:10px;font-size:13px">${hdr}</p><div class="cal-wrap">${tbl}</div>`;
  document.getElementById('plan-title').textContent=`Dienstplan ${MON_NAMES[ST.month]} ${ST.year}`;
}

// SUMMARY RENDER

function renderSummary(){
  if(!PLAN||!PLAN.stats){
    document.getElementById('summary-body').innerHTML=
      '<div class="alert alert-info">Bitte zuerst einen Plan generieren.</div>';
    return;
  }
  const s=PLAN.stats;
  let html=`<table class="sum-tbl"><thead><tr>
    <th>Name</th><th>FK</th><th>Soll</th>
    <th>Ist 24h</th><th>Ist Außerh.</th>
    <th>Bkp reg.</th><th>Bkp Werk.</th>
    <th>Urlaub</th><th>Sperrtage</th><th>Einschränkungen</th>
  </tr></thead><tbody>`;
  for(const emp of ST.employees){
    const st=s[emp.id]||{};
    const tot=(st.cnt24h||0)+(st.cntAusser||0);
    const target=emp.target||8;
    const diff=tot-target;
    const cls=diff<-1?'sum-err':diff<0?'sum-warn':'sum-ok';
    const fk=emp.hasLicense?'':'🚫🚗';
    html+=`<tr>
      <td><b>${emp.name}</b></td>
      <td style="text-align:center">${fk}</td>
      <td>${target}</td>
      <td class="${cls}">${st.cnt24h||0}</td>
      <td class="${cls}">${st.cntAusser||0}</td>
      <td>${st.cntBkpReg||0}</td>
      <td>${st.cntBkpWerk||0}</td>
      <td>${st.vacCount||0}</td>
      <td>${st.blkCount||0}</td>
      <td style="font-size:11px;color:var(--muted)">${emp.extraConstraints||''}</td>
    </tr>`;
  }
  html+='</tbody></table>';
  document.getElementById('summary-body').innerHTML=html;
}

// =====================================================================
// SETTINGS UI
// =====================================================================
function saveSettings(){
  ST.year=parseInt(document.getElementById('inp-year').value)||ST.year;
  ST.month=parseInt(document.getElementById('inp-month').value)||ST.month;
  ST.handoverTime=document.getElementById('inp-handover').value||ST.handoverTime;
  ST.normaltag.name=document.getElementById('nt-name').value||'24h-Dienst';
  ST.normaltag.start=document.getElementById('nt-start').value||'20:00';
  ST.normaltag.end=document.getElementById('nt-end').value||'20:00';

  const wkEn=document.getElementById('wk-enabled').checked;
  ST.werkstatt.enabled=wkEn;
  document.getElementById('wk-cfg').style.display=wkEn?'block':'none';
  document.getElementById('wk-lbl').textContent=wkEn?'Aktiviert':'Deaktiviert';
  ST.werkstatt.activeDays=[...document.querySelectorAll('.wk-day:checked')].map(c=>parseInt(c.value));
  document.querySelectorAll('.wk-time-row').forEach(row=>{
    const dow=parseInt(row.dataset.dow);
    if(!ST.werkstatt.dayConfig[dow]) ST.werkstatt.dayConfig[dow]={};
    ST.werkstatt.dayConfig[dow].start=row.querySelector('.wts').value||'08:00';
    ST.werkstatt.dayConfig[dow].end=row.querySelector('.wte').value||'15:00';
  });

  const fsEn=document.getElementById('fs-enabled').checked;
  ST.freischicht.enabled=fsEn;
  document.getElementById('fs-cfg').style.display=fsEn?'block':'none';
  document.getElementById('fs-lbl').textContent=fsEn?'Aktiviert':'Deaktiviert';
  ST.freischicht.activeDays=[...document.querySelectorAll('.fs-day:checked')].map(c=>parseInt(c.value));
  ST.freischicht.start=document.getElementById('fs-start').value||'08:00';
  ST.freischicht.end=document.getElementById('fs-end').value||'12:00';

  ST.printAuthor=document.getElementById('print-author').value;
  ST.printExtra=document.getElementById('print-extra').value;

  // Save employees from cards
  ST.employees=ST.employees.map(emp=>{
    const id=emp.id;
    const nameEl=document.getElementById(`ename-${id}`);
    if(!nameEl) return emp;
    emp.name=nameEl.value||emp.name;
    emp.target=parseInt(document.getElementById(`etgt-${id}`).value)||8;
    emp.hasLicense=document.getElementById(`elic-${id}`).checked;
    emp.prefShift=document.getElementById(`epref-${id}`).value;
    emp.extraConstraints=document.getElementById(`econstr-${id}`).value;
    const vacRaw=document.getElementById(`evac-${id}`).value;
    emp.vacations=vacRaw.split('\n').map(s=>s.trim()).filter(s=>s.match(/^\d{4}-\d{2}-\d{2}$/));
    const blkRaw=document.getElementById(`eblk-${id}`).value;
    emp.blockDays=blkRaw.split('\n').map(s=>s.trim()).filter(s=>s.match(/^\d{4}-\d{2}-\d{2}$/));
    return emp;
  });

  saveST();
  renderWerkstattTimes();
  updatePlanTitle();
}

function updatePlanTitle(){
  document.getElementById('plan-title').textContent=`Dienstplan ${MON_NAMES[ST.month]} ${ST.year}`;
}

function renderWerkstattTimes(){
  const container=document.getElementById('wk-times');
  if(!container) return;
  const active=ST.werkstatt.activeDays||[];
  if(active.length===0){ container.innerHTML=''; return; }
  let html='';
  for(const dow of active){
    const cfg=(ST.werkstatt.dayConfig||{})[dow]||{start:'08:00',end:'15:00'};
    html+=`<div class="wt-time-box wk-time-row" data-dow="${dow}">
      <label>${DOW_SHORT[dow]} – Zeiten Block A</label>
      <div class="row" style="gap:6px;margin:0">
        <div class="field"><label>Beginn</label><input type="time" class="wts" value="${cfg.start}" onchange="saveSettings()"></div>
        <div class="field"><label>Ende</label><input type="time" class="wte" value="${cfg.end}" onchange="saveSettings()"></div>
      </div>
    </div>`;
  }
  container.innerHTML=html;
}

function addEmployee(){
  const id=Date.now();
  ST.employees.push({
    id, name:`Mitarbeiter ${ST.employees.length+1}`,
    target:8, hasLicense:false,
    vacations:[], blockDays:[],
    prefShift:'normal', extraConstraints:''
  });
  saveST();
  renderEmpList();
}

function removeEmployee(id){
  if(!confirm('Mitarbeiter wirklich entfernen?')) return;
  ST.employees=ST.employees.filter(e=>e.id!==id);
  saveST();
  renderEmpList();
}

function renderEmpList(){
  const container=document.getElementById('emp-list');
  if(!container) return;
  if(ST.employees.length===0){
    container.innerHTML='<div class="alert alert-info">Noch keine Mitarbeiter. Klicken Sie auf "+ Hinzufügen".</div>';
    return;
  }
  let html='';
  for(const emp of ST.employees){
    const id=emp.id;
    const vacStr=(emp.vacations||[]).join('\n');
    const blkStr=(emp.blockDays||[]).join('\n');
    html+=`<div class="emp-card" id="ecard-${id}">
  <div class="emp-hdr">
    <span class="emp-name-lbl">${emp.name}</span>
    <span style="font-size:12px;color:var(--muted)">${emp.hasLicense?'🚗':'🚫🚗'}</span>
    <button class="icon-btn" onclick="removeEmployee(${id})" title="Entfernen">🗑</button>
  </div>
  <div class="row">
    <div class="field"><label>Name</label>
      <input type="text" id="ename-${id}" value="${emp.name}" onchange="saveSettings()"></div>
    <div class="field" style="max-width:90px"><label>Soll-Dienste</label>
      <input type="number" id="etgt-${id}" value="${emp.target||8}" min="0" max="31" onchange="saveSettings()"></div>
    <div class="field" style="max-width:200px">
      <label>Bevorzugter Dienst</label>
      <select id="epref-${id}" onchange="saveSettings()">
        <option value="normal"${emp.prefShift==='normal'?' selected':''}>Normal (24h)</option>
        <option value="ausserhalb"${emp.prefShift==='ausserhalb'?' selected':''}>Außerhalb</option>
      </select>
    </div>
    <div class="field" style="flex:0;min-width:120px">
      <label>Führerschein</label>
      <label class="chk" style="margin-top:8px">
        <input type="checkbox" id="elic-${id}" ${emp.hasLicense?'checked':''} onchange="saveSettings()"> Hat Führerschein
      </label>
    </div>
  </div>
  <div class="row">
    <div class="field"><label>Urlaube (JJJJ-MM-TT, eine pro Zeile)</label>
      <textarea id="evac-${id}" onchange="saveSettings()" rows="3">${vacStr}</textarea></div>
    <div class="field"><label>Sperrtage (JJJJ-MM-TT, eine pro Zeile)</label>
      <textarea id="eblk-${id}" onchange="saveSettings()" rows="3">${blkStr}</textarea></div>
    <div class="field" style="flex:2"><label>Einschränkungen / Hinweise (z.B. "bevorzugt Mo", "kein Sa")</label>
      <textarea id="econstr-${id}" onchange="saveSettings()" rows="3" style="font-family:'DM Sans',sans-serif">${emp.extraConstraints||''}</textarea></div>
  </div>
</div>`;
  }
  container.innerHTML=html;
}

function fillSettingsUI(){
  document.getElementById('inp-year').value=ST.year;
  document.getElementById('inp-month').value=ST.month;
  document.getElementById('inp-handover').value=ST.handoverTime;
  document.getElementById('nt-name').value=ST.normaltag.name;
  document.getElementById('nt-start').value=ST.normaltag.start;
  document.getElementById('nt-end').value=ST.normaltag.end;

  document.getElementById('wk-enabled').checked=ST.werkstatt.enabled;
  document.getElementById('wk-cfg').style.display=ST.werkstatt.enabled?'block':'none';
  document.getElementById('wk-lbl').textContent=ST.werkstatt.enabled?'Aktiviert':'Deaktiviert';
  document.querySelectorAll('.wk-day').forEach(cb=>{
    cb.checked=(ST.werkstatt.activeDays||[]).includes(parseInt(cb.value));
  });

  document.getElementById('fs-enabled').checked=ST.freischicht.enabled;
  document.getElementById('fs-cfg').style.display=ST.freischicht.enabled?'block':'none';
  document.getElementById('fs-lbl').textContent=ST.freischicht.enabled?'Aktiviert':'Deaktiviert';
  document.querySelectorAll('.fs-day').forEach(cb=>{
    cb.checked=(ST.freischicht.activeDays||[]).includes(parseInt(cb.value));
  });
  document.getElementById('fs-start').value=ST.freischicht.start;
  document.getElementById('fs-end').value=ST.freischicht.end;

  document.getElementById('print-author').value=ST.printAuthor||'';
  document.getElementById('print-extra').value=ST.printExtra||'';

  renderEmpList();
  renderWerkstattTimes();
  updatePlanTitle();
}

// =====================================================================
// TAB SWITCHING
// =====================================================================
function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
  document.getElementById(`pane-${tab}`).classList.add('on');
  if(tab==='plan'&&PLAN) renderCalendar();
  if(tab==='summary'&&PLAN) renderSummary();
}

// =====================================================================
// EXPORT / IMPORT
// =====================================================================
function exportJSON(){
  const blob=new Blob([JSON.stringify({ST,PLAN},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`dienstplan_${ST.year}_${pad2(ST.month)}.json`;
  a.click();
}
function importJSON(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(data.ST){ ST=Object.assign(defaultST(),data.ST); saveST(); fillSettingsUI(); }
      if(data.PLAN){ PLAN=data.PLAN; savePlan(); }
      alert('Import erfolgreich.');
    } catch(err){ alert('Fehler beim Import: '+err.message); }
  };
  reader.readAsText(file);
  event.target.value='';
}

// =====================================================================
// INIT
// =====================================================================
loadState();
fillSettingsUI();
if(PLAN){ renderCalendar(); renderSummary(); }
</script>
</body>
</html>
