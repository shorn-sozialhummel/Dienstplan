<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dienstplan v8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a3a5c;--navy-l:#2a5080;--navy-bg:#e8f0f8;
  --bg:#f5f6f8;--surface:#fff;--border:#dde2ea;
  --text:#1e2d3d;--muted:#6b7a8d;
  --green:#15803d;--green-bg:#dcfce7;--green-b:#86efac;
  --amber:#92400e;--amber-bg:#fef3c7;--amber-b:#fcd34d;
  --red:#be123c;--red-bg:#ffe4e6;--red-b:#fca5a5;
  --blue:#1d4ed8;--blue-bg:#dbeafe;--blue-b:#93c5fd;
  --cyan:#0e7490;--cyan-bg:#cffafe;--cyan-b:#67e8f9;
  --r:8px;
}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}
.hdr{background:var(--navy);color:#fff;padding:0 18px;display:flex;align-items:center;gap:12px;height:52px;position:sticky;top:0;z-index:300;box-shadow:0 2px 8px rgba(0,0,0,.25);flex-wrap:wrap}
.hdr h1{font-size:15px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.hdr .sub{font-size:10px;opacity:.55;margin-top:1px}
.hdr-sp{flex:1}
.topbar{background:var(--surface);border-bottom:2px solid var(--border);padding:8px 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:52px;z-index:200}
.team-pill{display:inline-flex;align-items:center;padding:4px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--bg);color:var(--muted);transition:all .15s;gap:4px}
.team-pill:hover{border-color:var(--navy-bg);color:var(--navy)}
.team-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.team-pill input{border:none;background:transparent;color:inherit;font:inherit;outline:none;width:80px}
.topbar-sp{flex:1}
.tabs{background:var(--surface);border-bottom:2px solid var(--border);display:flex;padding:0 18px;position:sticky;top:100px;z-index:190}
.tab{padding:11px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.layout{display:flex;gap:0;height:calc(100vh - 152px)}
.sidebar{width:168px;min-width:168px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sb-title{padding:10px 12px 6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.sb-list{flex:1;overflow-y:auto;padding:6px 0}
.sb-item{padding:8px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;border-left:3px solid transparent;transition:all .1s}
.sb-item:hover{background:var(--navy-bg)}
.sb-item.active{background:var(--navy-bg);border-left-color:var(--navy);color:var(--navy);font-weight:600}
.sb-kuerzel{width:26px;height:26px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'DM Mono',monospace}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border)}
.main-area{flex:1;overflow-y:auto;padding:18px 20px}
.pane{display:none}
.pane.on{display:flex;flex-direction:column;height:100%}
#pane-save{display:none}
#pane-save.on{display:block;padding:18px 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:14px}
.ch{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch h2{font-size:14px;font-weight:700}
.ch h3{font-size:13px;font-weight:600}
.ch-act{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cb{padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover:not(:disabled){background:var(--navy-l)}
.btn-sec{background:var(--surface);color:var(--text);border-color:var(--border)}.btn-sec:hover:not(:disabled){background:var(--navy-bg)}
.btn-danger{background:#fff;color:var(--red);border-color:var(--red-b)}.btn-danger:hover:not(:disabled){background:var(--red-bg)}
.btn-amber{background:#fff;color:var(--amber);border-color:var(--amber-b)}.btn-amber:hover:not(:disabled){background:var(--amber-bg)}
.btn-green{background:#fff;color:var(--green);border-color:var(--green-b)}.btn-green:hover:not(:disabled){background:var(--green-bg)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:2px 7px;font-size:11px}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:6px 9px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-l)}
input[type=color]{padding:2px;height:32px;cursor:pointer;border-radius:6px}
textarea{resize:vertical;min-height:54px;font-family:'DM Mono',monospace;font-size:11px}
.row{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
.field{flex:1;min-width:70px}
.sep{height:1px;background:var(--border);margin:12px 0}
.toggle{position:relative;width:38px;height:20px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.toggle-sl{position:absolute;inset:0;background:var(--border);border-radius:10px;cursor:pointer;transition:.2s}
.toggle-sl:before{content:'';position:absolute;width:16px;height:16px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-sl{background:var(--navy)}
.toggle input:checked+.toggle-sl:before{transform:translateX(18px)}
.toggle-wrap{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--text)}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.chk input[type=checkbox]{width:auto;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500;margin:2px}
.chip-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b)}
.chip-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-b)}
.chip-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-b)}
.chip-del{background:none;border:none;cursor:pointer;font-size:13px;color:inherit;line-height:1;padding:0 2px;opacity:.7}
.chip-del:hover{opacity:1}
.alert{padding:9px 13px;border-radius:6px;font-size:12px;margin-bottom:10px}
.alert-info{background:var(--blue-bg);border:1px solid var(--blue-b);color:var(--blue)}
.alert-warn{background:var(--amber-bg);border:1px solid var(--amber-b);color:var(--amber)}
.alert-err{background:var(--red-bg);border:1px solid var(--red-b);color:var(--red)}
.alert-ok{background:var(--green-bg);border:1px solid var(--green-b);color:var(--green)}
.kz-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kz-card{flex:1;min-width:90px;background:var(--navy-bg);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px}
.kz-val{font-size:24px;font-weight:700;color:var(--navy);font-family:'DM Mono',monospace}
.kz-lbl{font-size:11px;color:var(--muted);margin-top:2px}
#banner{position:fixed;top:52px;left:0;right:0;z-index:500;background:#fef3c7;border-bottom:2px solid var(--amber-b);color:var(--amber);padding:8px 18px;display:none;align-items:center;gap:10px;font-size:13px;font-weight:500}
#banner.show{display:flex}
.month-sw{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy)}
.month-sw button{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:14px;transition:background .15s}
.month-sw button:hover{background:var(--navy-bg)}
/* CELL DROPDOWN */
.cell-dd{position:fixed;z-index:1000;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);min-width:220px;padding:6px 0;display:none}
.cell-dd.show{display:block}
.cell-dd-title{padding:5px 12px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:4px}
.cell-dd-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif}
.cell-dd-item:hover{background:var(--navy-bg)}
.cell-dd-item.unavail{opacity:.45;cursor:not-allowed}
.cell-dd-item.unavail:hover{background:none}
.cell-dd-kuerzel{width:22px;height:22px;border-radius:50%;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;flex-shrink:0}
/* SAVE TAB */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.stat-val{font-size:20px;font-weight:700;color:var(--navy);font-family:'DM Mono',monospace}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:3px}
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.over{border-color:var(--navy-l);background:var(--navy-bg);color:var(--navy)}
.log-tbl{border-collapse:collapse;width:100%;font-size:12px}
.log-tbl th{background:var(--navy-bg);color:var(--navy);padding:5px 10px;text-align:left;border:1px solid var(--border);font-size:11px}
.log-tbl td{border:1px solid var(--border);padding:5px 10px;font-family:'DM Mono',monospace;font-size:11px}
.badge{display:inline-block;padding:1px 7px;border-radius:12px;font-size:10px;font-weight:700}
.badge-auto{background:var(--blue-bg);color:var(--blue)}
.badge-manual{background:var(--amber-bg);color:var(--amber)}
.viol-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px}
.viol-item:last-child{border-bottom:none}
.viol-icon{flex-shrink:0;font-size:14px;margin-top:1px}
.sum-tbl{border-collapse:collapse;width:100%;font-size:12px;font-family:'DM Mono',monospace}
.sum-tbl th{background:var(--navy-bg);color:var(--navy);padding:6px 10px;text-align:left;border:1px solid var(--border);font-size:11px;white-space:nowrap}
.sum-tbl td{border:1px solid var(--border);padding:5px 10px;vertical-align:middle}
.sum-tbl tr:hover td{background:var(--navy-bg)}
.sum-ok{color:var(--green);font-weight:700}
.sum-warn{color:var(--amber);font-weight:700}
.sum-err{color:var(--red);font-weight:700}
/* DOW CHECKS */
.dow-checks{display:flex;gap:8px;flex-wrap:wrap}
.dow-chk{display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;padding:3px 8px;border:1px solid var(--border);border-radius:4px}
.dow-chk input[type=checkbox]{width:auto}
.dow-chk.checked{background:var(--navy-bg);border-color:var(--navy)}
.shift-boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:8px}
.shift-box{border:1px solid var(--border);border-radius:6px;padding:10px;background:#fff}
.shift-box label{color:var(--navy);font-size:11px;margin-bottom:5px}
/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;color:var(--muted);text-align:center;gap:10px}
.empty-state .icon{font-size:40px;opacity:.4}
.empty-state p{font-size:13px;max-width:280px}
/* MA PILLS */
.ma-pill{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;margin:1px;transition:opacity .1s}
.ma-pill:hover{opacity:.82}
.ma-pill sup{font-size:9px;opacity:.85;margin-left:1px}
.ma-pill-small{display:inline-flex;align-items:center;padding:2px 6px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;margin:1px;opacity:.75}
/* LIST VIEW PLAN TABLE */
.plan-wrap{overflow:auto}
.plan-list{border-collapse:collapse;font-size:12px;width:100%;min-width:680px}
.plan-list th{background:var(--navy);color:#fff;padding:6px 10px;text-align:left;border:1px solid #2a4a6c;font-size:11px;white-space:nowrap;position:sticky;top:0;z-index:10}
.plan-list td{border:1px solid var(--border);padding:5px 8px;vertical-align:middle}
.plan-list tr.r-we td{background:#f8f9fb}
.plan-list tr.r-hol td{background:#fef7e9}
.plan-list tr.r-werk-a td{background:#f0fbff}
.plan-list tr.r-werk-b td{background:#f0fbff}
.plan-list tr.r-frei td{background:#f9f9ff}
.plan-list tr.r-termin td{background:#fdf4ff;border-top:2px solid #c4b5fd}
.plan-list td.td-date{font-family:'DM Mono',monospace;font-size:11px;white-space:nowrap;min-width:80px;font-weight:600}
.plan-list td.td-date.hol-date{color:#7c4a0e}
.plan-list td.td-desc{font-size:11px;color:var(--muted);white-space:nowrap;min-width:150px}
.plan-list td.td-assign{min-width:100px}
.plan-list td.td-avail{min-width:80px;font-size:10px}
/* COLOR SWATCHES */
.color-swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .1s}
.color-swatch:hover{transform:scale(1.15)}
.color-swatch.sel{border-color:#fff;box-shadow:0 0 0 2px var(--navy)}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
/* INLINE CALENDAR */
.cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:14px}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-nav-title{font-weight:700;font-size:13px;color:var(--navy)}
.cal-nav-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:2px 8px;cursor:pointer;font-size:13px}
.cal-nav-btn:hover{background:var(--navy-bg)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.cal-dow span{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{text-align:center;padding:5px 2px;border-radius:5px;font-size:12px;cursor:pointer;transition:background .1s;position:relative}
.cal-cell:hover:not(.cal-other):not(.cal-disabled){background:var(--navy-bg)}
.cal-cell.cal-other{color:#ccc;cursor:default}
.cal-cell.cal-today{font-weight:700;text-decoration:underline}
.cal-cell.cal-we{color:var(--muted)}
.cal-cell.cal-vac{background:var(--blue-bg);color:var(--blue);font-weight:600}
.cal-cell.cal-sperr{background:var(--amber-bg);color:var(--amber);font-weight:600}
.cal-cell.cal-hol{background:#fef7e9;color:#7c4a0e}
.cal-cell.cal-sel{background:var(--navy);color:#fff;font-weight:700}
.cal-cell.cal-range{background:var(--blue-bg)}
.cal-modes{display:flex;gap:6px;margin-bottom:8px}
.cal-mode-btn{flex:1;padding:5px 0;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--muted)}
.cal-mode-btn.active-vac{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b)}
.cal-mode-btn.active-sperr{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-b)}
/* TERMIN */
.termin-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;margin:1px}
/* STUNDENKONTO */
.sk-bar{display:flex;align-items:center;gap:8px;font-size:12px}
.sk-pos{color:var(--amber);font-weight:700}
.sk-neg{color:var(--blue);font-weight:700}
.sk-zero{color:var(--muted)}
/* PRINT */
@media print{
  .tabs,.topbar,.hdr,.btn,.cell-dd,.ch-act,#banner{display:none!important}
  body{background:#fff;font-size:9px}
  .layout{height:auto;display:block}
  .sidebar{display:none!important}
  .main-area{padding:0}
  .plan-list{font-size:9px}
  .plan-list td,.plan-list th{padding:2px 4px}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>
<body>

<div id="banner">
  <span>💾 Daten gespeichert – Backup empfohlen</span>
  <button class="btn btn-amber btn-sm" onclick="doBackupExport()">Jetzt Backup erstellen</button>
  <button class="btn btn-xs btn-sec" style="margin-left:auto" onclick="hideBanner()">×</button>
</div>

<div class="cell-dd" id="cell-dd"></div>

<div class="hdr">
  <div>
    <h1>📋 Dienstplan</h1>
    <div class="sub">v8 · Multi-Team · NRW</div>
  </div>
  <div class="hdr-sp"></div>
  <button class="btn btn-sec btn-sm" onclick="window.print()">🖨 Drucken</button>
</div>

<div class="topbar" id="topbar">
  <span style="font-size:12px;font-weight:600;color:var(--muted)">Teams:</span>
  <div id="team-pills"></div>
  <button class="btn btn-sec btn-sm" onclick="addTeam()">+ Team</button>
  <button class="btn btn-danger btn-sm" onclick="deleteTeam()">Team löschen</button>
  <div class="topbar-sp"></div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="stamm" onclick="switchTab('stamm')">👤 Stammdaten</button>
  <button class="tab" data-tab="monat" onclick="switchTab('monat')">📅 Monatsdaten</button>
  <button class="tab" data-tab="plan" onclick="switchTab('plan')">📋 Dienstplan</button>
  <button class="tab" data-tab="save" onclick="switchTab('save')">💾 Speichern/Laden</button>
</div>

<!-- TAB 1 STAMMDATEN -->
<div id="pane-stamm" class="pane on">
  <div class="layout">
    <div class="sidebar">
      <div class="sb-title">Mitarbeitende</div>
      <div class="sb-list" id="sb-stamm"></div>
      <div class="sb-foot">
        <button class="btn btn-primary btn-sm" style="width:100%" onclick="addMA()">+ Mitarbeiter/in</button>
      </div>
    </div>
    <div class="main-area" id="ma-detail">
      <div class="empty-state"><div class="icon">👤</div><p>Wählen Sie eine Person aus der Liste oder fügen Sie eine neue hinzu.</p></div>
    </div>
  </div>
</div>

<!-- TAB 2 MONATSDATEN -->
<div id="pane-monat" class="pane">
  <div class="layout">
    <div class="sidebar">
      <div class="sb-title">Mitarbeitende</div>
      <div class="sb-list" id="sb-monat"></div>
    </div>
    <div class="main-area" id="monat-detail">
      <div class="empty-state"><div class="icon">📅</div><p>Wählen Sie eine Person und einen Monat.</p></div>
    </div>
  </div>
</div>

<!-- TAB 3 DIENSTPLAN -->
<div id="pane-plan" class="pane">
  <div style="padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="month-sw">
      <button onclick="changeMonth(-1)">←</button>
      <span id="plan-month-lbl">—</span>
      <button onclick="changeMonth(1)">→</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1">
      <span style="font-size:12px;font-weight:600;color:var(--muted)">Werkstatttage:</span>
      <div class="dow-checks" id="werk-checks"></div>
      <span style="font-size:12px;font-weight:600;color:var(--muted);margin-left:10px">Freischicht:</span>
      <div class="dow-checks" id="frei-checks"></div>
    </div>
    <button class="btn btn-primary" onclick="generatePlan()">▶ Plan generieren</button>
    <button class="btn btn-amber" onclick="doUndo()" id="btn-undo" disabled>↩ Rückgängig</button>
  </div>
  <div style="padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border)">

<script>
'use strict';

const HOLS = {
  2025:{'2025-01-01':'Neujahr','2025-04-18':'Karfreitag','2025-04-21':'Ostermontag','2025-05-01':'Tag der Arbeit','2025-05-29':'Christi Himmelfahrt','2025-06-09':'Pfingstmontag','2025-06-19':'Fronleichnam','2025-10-03':'Tag d. dt. Einheit','2025-11-01':'Allerheiligen','2025-12-25':'1. Weihnachtstag','2025-12-26':'2. Weihnachtstag'},
  2026:{'2026-01-01':'Neujahr','2026-04-03':'Karfreitag','2026-04-06':'Ostermontag','2026-05-01':'Tag der Arbeit','2026-05-14':'Christi Himmelfahrt','2026-05-25':'Pfingstmontag','2026-06-04':'Fronleichnam','2026-10-03':'Tag d. dt. Einheit','2026-11-01':'Allerheiligen','2026-12-25':'1. Weihnachtstag','2026-12-26':'2. Weihnachtstag'},
  2027:{'2027-01-01':'Neujahr','2027-03-26':'Karfreitag','2027-03-29':'Ostermontag','2027-05-01':'Tag der Arbeit','2027-05-06':'Christi Himmelfahrt','2027-05-17':'Pfingstmontag','2027-05-27':'Fronleichnam','2027-10-03':'Tag d. dt. Einheit','2027-11-01':'Allerheiligen','2027-12-25':'1. Weihnachtstag','2027-12-26':'2. Weihnachtstag'}
};

function isHol(ds){const y=parseInt(ds);return !!(HOLS[y]&&HOLS[y][ds]);}
function holName(ds){const y=parseInt(ds);return HOLS[y]&&HOLS[y][ds]||'';}

const DOW_DE=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON_DE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MA_COLORS=['#1a3a5c','#15803d','#b45309','#7c3aed','#be123c','#0e7490','#92400e','#4338ca'];

const LS_KEY='dp_v8';
let ST=null;
let activeTab='stamm';
let selectedMAId=null;

// Inline calendar state
let calMode='vac'; // 'vac'|'sperr'
let calTempStart=null;
let calSperrPendingDs=null; // day awaiting TK approval

// ─── UTILITIES ───
function fmtDate(d){
  if(typeof d==='string') return d;
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function fmtDisp(ds){if(!ds) return '';const[y,m,d]=ds.split('-');return `${d}.${m}.${y}`;}
function fmtMonthDisp(mk){if(!mk) return '';const[y,m]=mk.split('-');return `${MON_DE[parseInt(m)-1]} ${y}`;}
function monthKey(y,m){return `${y}-${String(m).padStart(2,'0')}`;}
function daysInMonth(mk){const[y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate();}
function dayStr(mk,d){const[y,m]=mk.split('-');return `${y}-${m}-${String(d).padStart(2,'0')}`;}
function isWE(ds){const d=new Date(ds).getDay();return d===0||d===6;}
function uid(){return '_'+Math.random().toString(36).slice(2,10);}
function esc(s){if(!s) return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function findTeam(tid){return ST.teams.find(t=>t.id===tid);}
function findMA(tid,mid){const t=findTeam(tid);return t&&t.mitarbeitende.find(m=>m.id===mid);}
function activeTeam(){return findTeam(ST.aktivesTeam);}
function allMAs(){const t=activeTeam();return t?t.mitarbeitende:[];}

function getMAMonat(ma,mk){
  if(!ma.monatsdaten) ma.monatsdaten={};
  if(!ma.monatsdaten[mk]) ma.monatsdaten[mk]={sollDienste:0,stundenkonto:0,monatEinschraenkungen:'',urlaube:[],sperrtage:[]};
  if(ma.monatsdaten[mk].stundenkonto===undefined) ma.monatsdaten[mk].stundenkonto=0;
  return ma.monatsdaten[mk];
}

function vacDaysInMonth(ma,mk){
  const md=ma.monatsdaten&&ma.monatsdaten[mk];
  if(!md||!md.urlaube) return 0;
  const[y,mo]=mk.split('-').map(Number);
  const mStart=new Date(y,mo-1,1),mEnd=new Date(y,mo,0);
  let cnt=0;
  (md.urlaube||[]).forEach(u=>{
    const von=new Date(u.von),bis=new Date(u.bis);
    let d=new Date(Math.max(von,mStart));
    const end=new Date(Math.min(bis,mEnd));
    while(d<=end){cnt++;d.setDate(d.getDate()+1);}
  });
  return cnt;
}

function buildVacSet(ma,mk){
  const md=ma.monatsdaten&&ma.monatsdaten[mk];
  const s=new Set();
  if(!md) return s;
  (md.urlaube||[]).forEach(u=>{
    let d=new Date(u.von);const end=new Date(u.bis);
    while(d<=end){s.add(fmtDate(d));d.setDate(d.getDate()+1);}
  });
  return s;
}
function buildSperSet(ma,mk){
  const md=ma.monatsdaten&&ma.monatsdaten[mk];
  const s=new Set();
  if(!md) return s;
  (md.sperrtage||[]).forEach(sp=>s.add(sp.datum));
  return s;
}

function maColor(ma){return ma.farbe||MA_COLORS[0];}
function maKuerzel(ma){return (ma.kuerzel||(ma.vorname[0]+ma.nachname[0])).toUpperCase().slice(0,3);}

function countWE(mk){
  const dim=daysInMonth(mk);let cnt=0;
  for(let d=1;d<=dim;d++){if(isWE(dayStr(mk,d))) cnt++;}
  return cnt;
}

function maxSperrtageForMA(ma,mk){
  const vac=vacDaysInMonth(ma,mk);
  return Math.max(0,4-Math.floor(vac/7));
}

// ─── INIT / LOAD / SAVE ───
function defaultState(){
  return {
    teams:[{id:'team_1',name:'Team 1',mitarbeitende:[],termine:{}}],
    einstellungen:{
      werkstatttage:[],freischichttage:[],
      schichtzeiten:{
        normal:{name:'24h-Dienst',start:'20:00',end:'20:00'},
        werkstattA:{start:'08:00',end:'15:00'},
        freischichtA:{start:'08:00',end:'12:00'}
      }
    },
    aktivesTeam:'team_1',
    aktiverMonat:monthKey(new Date().getFullYear(),new Date().getMonth()+1),
    letztesSpeichern:null,letztesBackup:null,verlauf:[],plans:{}
  };
}

function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ST=JSON.parse(raw);if(!ST.plans)ST.plans={};}
    else ST=defaultState();
    // Migrate: ensure termine on each team
    ST.teams.forEach(t=>{if(!t.termine)t.termine={};});
  }catch(e){ST=defaultState();}
}

function autoSave(desc){
  ST.letztesSpeichern=new Date().toISOString();
  if(desc){
    if(!ST.verlauf) ST.verlauf=[];
    ST.verlauf.unshift({ts:ST.letztesSpeichern,desc,type:'auto'});
    if(ST.verlauf.length>10) ST.verlauf.length=10;
  }
  try{localStorage.setItem(LS_KEY,JSON.stringify(ST));}catch(e){alert('LocalStorage voll! Bitte exportieren.');}
  updateSaveTab();
}

let bannerTimeout=null;
function showBanner(){const b=document.getElementById('banner');b.classList.add('show');clearTimeout(bannerTimeout);bannerTimeout=setTimeout(hideBanner,8000);}
function hideBanner(){document.getElementById('banner').classList.remove('show');}

// ─── NAVIGATION ───
function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  document.querySelectorAll('.pane').forEach(p=>{
    const id='pane-'+tab;
    if(p.id===id){p.classList.add('on');p.style.display='';}
    else{p.classList.remove('on');if(p.id==='pane-save')p.style.display='none';}
  });
  const savePane=document.getElementById('pane-save');
  if(tab==='save'){savePane.style.display='block';savePane.classList.add('on');renderSaveTab();}
  if(tab==='stamm'){renderSidebar('sb-stamm');renderMADetail();}
  if(tab==='monat'){renderSidebar('sb-monat');renderMonatDetail();}
  if(tab==='plan'){renderPlanTab();}
}

function changeMonth(delta){
  const[y,m]=ST.aktiverMonat.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  ST.aktiverMonat=monthKey(d.getFullYear(),d.getMonth()+1);
  autoSave('Monat: '+fmtMonthDisp(ST.aktiverMonat));
  calTempStart=null;calSperrPendingDs=null;
  if(activeTab==='monat') renderMonatDetail();
  if(activeTab==='plan') renderPlanTab();
  document.getElementById('plan-month-lbl').textContent=fmtMonthDisp(ST.aktiverMonat);
}

// ─── TEAM MANAGEMENT ───
function renderTopbar(){
  const pills=document.getElementById('team-pills');
  pills.innerHTML=ST.teams.map(t=>`
    <span class="team-pill ${t.id===ST.aktivesTeam?'active':''}" onclick="selectTeam('${t.id}')" ondblclick="renameTeamInline('${t.id}',this)">${esc(t.name)}</span>

function deleteTeam(){

  if(!confirm(`Team "${t.name}" wirklich löschen?`)) return;

// ─── TAB 1 – STAMMDATEN ───
function addMA(){
  const t=activeTeam();if(!t) return;
  const id='ma_'+uid();
  const usedColors=t.mitarbeitende.map(m=>m.farbe);

        <span id="save-flash" style="color:var(--green);font-size:12px;display:none">✓ Gespeichert</span>

        <div class="field"><label>Vorname</label><input type="text" id="ma-vorname" value="${esc(ma.vorname)}" oninput="autoGenKuerzel()"></div>
        <div class="field"><label>Nachname</label><input type="text" id="ma-nachname" value="${esc(ma.nachname)}" oninput="autoGenKuerzel()"></div>

        <div class="field" style="max-width:120px"><label>Stellenanteil %</label><input type="number" id="ma-stellen" value="${ma.stellenanteil||100}" min="1" max="200"></div>

          <div class="color-swatches" id="color-swatches">${swatches}</div>

        <div class="field">

            <span id="fuehr-lbl">${ma.fuehrerschein?'Ja ✓':'Nein 🚫🚗'}</span>
          </label>
        </div>
        <div class="field">
          <label>Qualifikationen</label>
          <div style="display:flex;flex-direction:column;gap:5px;margin-top:4px">

function pickColor(c){

function autoGenKuerzel(){

  k.value=((v.value[0]||'')+(n.value[0]||'')).toUpperCase();
}

function saveMAForm(){
  const t=activeTeam();const ma=findMA(t&&t.id,selectedMAId);if(!ma) return;

}

// ─── TAB 2 – MONATSDATEN ───

  const maxSperr=maxSperrtageForMA(ma,mk);

  const weTage=countWE(mk);
  const freiPlanbar=Math.max(0,dim-urlaubTage-sperTage-weTage);
  const sk=md.stundenkonto||0;
  const skCls=sk>0?'sk-pos':sk<0?'sk-neg':'sk-zero';

  el.innerHTML=`

function buildCalGrid(ma,mk,md){
  const[y,mo]=mk.split('-').map(Number);
  const first=new Date(y,mo-1,1);
  const last=new Date(y,mo,0);
  const startDow=(first.getDay()+6)%7;
  const today=fmtDate(new Date());
  const vacSet=buildVacSet(ma,mk);
  const sperSet=buildSperSet(ma,mk);
  let html='';
  let day=1-startDow;
  for(let row=0;row<6;row++){
    for(let col=0;col<7;col++){
      if(day<1||day>last.getDate()){html+=`<div class="cal-cell cal-other">${day>=1&&day<=last.getDate()?day:''}</div>`;day++;continue;}
      const ds=`${y}-${String(mo).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      let cls='cal-cell';
      if(ds===today) cls+=' cal-today';
      if(col>=5) cls+=' cal-we';
      if(isHol(ds)) cls+=' cal-hol';
      if(vacSet.has(ds)) cls+=' cal-vac';
      else if(sperSet.has(ds)) cls+=' cal-sperr';
      if(calTempStart){
        if(ds===calTempStart) cls+=' cal-sel';
        else if(ds>calTempStart) cls+=' cal-range';
      }
      html+=`<div class="${cls}" onclick="calClick('${ds}')" title="${holName(ds)||fmtDisp(ds)}">${day}</div>`;
      day++;
    }
  }
  return html;
}

function setCalMode(mode){
  calMode=mode;calTempStart=null;calSperrPendingDs=null;
  if(activeTab==='monat') renderMonatDetail();
}

function calClick(ds){
  const t=activeTeam();const ma=findMA(t&&t.id,selectedMAId);if(!ma) return;
  const mk=ST.aktiverMonat;const md=getMAMonat(ma,mk);
  if(calMode==='vac'){
    if(!calTempStart){
      calTempStart=ds;
      renderMonatDetail();
    } else {
      let von=calTempStart,bis=ds;
      if(bis<von){[von,bis]=[bis,von];}
      calTempStart=null;
      if(!md.urlaube) md.urlaube=[];
      md.urlaube.push({von,bis});
      md.urlaube.sort((a,b)=>a.von.localeCompare(b.von));
      autoSave('Urlaub hinzugefügt');
      renderMonatDetail();
    }
  } else {
    // sperrtag toggle
    const maxSperr=maxSperrtageForMA(ma,mk);
    if(!md.sperrtage) md.sperrtage=[];
    const idx=md.sperrtage.findIndex(s=>s.datum===ds);
    if(idx>=0){
      md.sperrtage.splice(idx,1);
      calSperrPendingDs=null;
      autoSave('Sperrtag entfernt');
    } else {
      const vacSet=buildVacSet(ma,mk);
      if(vacSet.has(ds)){return;} // silently ignore vacation days
      const normalCount=md.sperrtage.filter(s=>!s.tkAusnahme).length;
      if(normalCount>=maxSperr){
        // Don't alert – show TK pending UI instead
        calSperrPendingDs=ds;
      } else {
        calSperrPendingDs=null;
        md.sperrtage.push({datum:ds,grund:'',tkAusnahme:false});
        md.sperrtage.sort((a,b)=>a.datum.localeCompare(b.datum));
        autoSave('Sperrtag hinzugefügt');
      }
    }
    renderMonatDetail();
  }
}

function confirmTKAusnahme(ds){
  const t=activeTeam();const ma=findMA(t&&t.id,selectedMAId);if(!ma) return;
  const mk=ST.aktiverMonat;const md=getMAMonat(ma,mk);
  const maxSperr=maxSperrtageForMA(ma,mk);
  const total=(md.sperrtage||[]).length;
  if(!confirm(`TK-Ausnahme genehmigen?\n\nDatum: ${fmtDisp(ds)}\nMA: ${ma.vorname} ${ma.nachname}\nAktuell: ${total}/${maxSperr} Sperrtage\n\nEin weiterer Sperrtag wird als TK-Ausnahme eingetragen.`)) return;
  if(!md.sperrtage) md.sperrtage=[];
  md.sperrtage.push({datum:ds,grund:'TK-Ausnahme',tkAusnahme:true});
  md.sperrtage.sort((a,b)=>a.datum.localeCompare(b.datum));
  calSperrPendingDs=null;
  autoSave('Sperrtag (TK-Ausnahme) hinzugefügt');
  renderMonatDetail();
}

function renderUrlaubList(md){
  if(!(md.urlaube&&md.urlaube.length)) return '<div style="color:var(--muted);font-size:12px">Kein Urlaub.</div>';
  return '<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px">🏖 Urlaub</div>'+
    (md.urlaube||[]).map((u,i)=>{
      const days=Math.round((new Date(u.bis)-new Date(u.von))/86400000)+1;
      return `<span class="chip chip-blue">${fmtDisp(u.von)}–${fmtDisp(u.bis)} (${days}d)<button class="chip-del" onclick="deleteUrlaub(${i})">×</button></span>`;
    }).join('');
}

function renderSperrList(md,maxSperr){
  const cnt=(md.sperrtage||[]).length;
  const normalCnt=(md.sperrtage||[]).filter(s=>!s.tkAusnahme).length;
  const atLimit=normalCnt>=maxSperr;
  const hdr=`<div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px">🚫 Sperrtage (${normalCnt}/${maxSperr}${cnt>normalCnt?' +'+( cnt-normalCnt)+' TK':''})${atLimit?` <span style="color:var(--amber);font-weight:700">· Limit erreicht</span>`:''}</div>`;
  if(!cnt) return hdr+'<div style="color:var(--muted);font-size:12px">Keine Sperrtage.</div>';
  return hdr+(md.sperrtage||[]).map((s,i)=>`<span class="chip chip-amber">${fmtDisp(s.datum)}${s.tkAusnahme?'<span class="badge badge-manual" style="margin-left:4px;font-size:9px">TK</span>':''}${s.grund&&s.grund!=='TK-Ausnahme'?' – '+esc(s.grund):''}<button class="chip-del" onclick="deleteSperrtag(${i})">×</button></span>`).join('');
}

function generatePlan(){
  const t=activeTeam();if(!t||!t.mitarbeitende.length){alert('Keine Mitarbeitenden vorhanden.');return;}
  const pk=planKey();
  undoStack.push(JSON.parse(JSON.stringify(ST.plans[pk]||null)));
  if(undoStack.length>20) undoStack.shift();
  document.getElementById('btn-undo').disabled=false;

  const mk=ST.aktiverMonat;const mas=t.mitarbeitende;
  const dim=daysInMonth(mk);const ei=ST.einstellungen;

  const ed={};
  mas.forEach(ma=>{
    const md=ma.monatsdaten&&ma.monatsdaten[mk];
    const baseSoll=(md&&md.sollDienste)||0;
    const sk=(md&&md.stundenkonto)||0;
    const adjustedSoll=sk>0?Math.max(0,baseSoll-Math.round(sk/24)):baseSoll;
    ed[ma.id]={
      vacSet:buildVacSet(ma,mk),sperSet:buildSperSet(ma,mk),
      asgn:{},cnt24h:0,cntBkpReg:0,cntBkpWerk:0,
      lastDay:-1,
      soll:adjustedSoll,
      maxD:ma.maxDiensteProMonat||10,
      pref:parsePrefDays(ma.bevorzugteTage||'')
    };
  });

  const days=[];
  for(let d=1;d<=dim;d++){
    const ds=dayStr(mk,d);
    const dow=new Date(ds).getDay();
    const isWerk=ei.werkstatttage.includes(dow);
    const isFrei=ei.freischichttage.includes(dow);
    let type='normal';
    if(isWerk) type='werkstatt';
    else if(isFrei) type='freischicht';
    days.push({d,ds,dow,type,we:isWE(ds),hol:isHol(ds),hauptD:null,backupD:null,waBkp:null});
  }

  const asgn=(maId,di)=>ed[maId].asgn[di]||{};
  const isAvail=(maId,di)=>!ed[maId].vacSet.has(days[di].ds)&&!ed[maId].sperSet.has(days[di].ds);

  function canAssignDienst(maId,di){
    if(!isAvail(maId,di)) return false;
    const a=asgn(maId,di);if(a.hasHaupt||a.hasBelegt) return false;
    if(di>0&&asgn(maId,di-1).hasHaupt) return false;
    if(di<dim-1&&asgn(maId,di+1).hasHaupt) return false;
    if(di>=2&&asgn(maId,di-1).hasBelegt&&asgn(maId,di-2).hasBelegt) return false;
    if(di+2<dim&&asgn(maId,di+1).hasBelegt&&asgn(maId,di+2).hasBelegt) return false;
    if(di>=2&&asgn(maId,di-2).hasHaupt&&asgn(maId,di-1).hasBackup) return false;
    if(di+2<dim&&asgn(maId,di+1).hasBackup&&asgn(maId,di+2).hasHaupt) return false;
    if(ed[maId].cnt24h>=ed[maId].maxD) return false;
    return true;
  }

  function canAssignBackup(maId,di){
    if(!isAvail(maId,di)) return false;
    const a=asgn(maId,di);if(a.hasHaupt||a.hasBackup) return false;
    if(di>=2&&asgn(maId,di-1).hasBelegt&&asgn(maId,di-2).hasBelegt) return false;
    if(di+2<dim&&asgn(maId,di+1).hasBelegt&&asgn(maId,di+2).hasBelegt) return false;
    return true;
  }

  function canAssignWABkp(maId,di){
    if(!isAvail(maId,di)) return false;
    const a=asgn(maId,di);if(a.isWABkp) return false;
    if(di>=2&&asgn(maId,di-1).hasBelegt&&asgn(maId,di-2).hasBelegt) return false;
    return true;
  }

  function setHaupt(maId,di){
    if(!ed[maId].asgn[di]) ed[maId].asgn[di]={};
    ed[maId].asgn[di].hasHaupt=true;ed[maId].asgn[di].hasBelegt=true;
    ed[maId].cnt24h++;ed[maId].lastDay=di;days[di].hauptD=maId;
  }
  function setBackup(maId,di){
    if(!ed[maId].asgn[di]) ed[maId].asgn[di]={};
    ed[maId].asgn[di].hasBackup=true;ed[maId].asgn[di].hasBelegt=true;
    ed[maId].cntBkpReg++;ed[maId].lastDay=di;days[di].backupD=maId;
  }
  function setWABkp(maId,di){
    if(!ed[maId].asgn[di]) ed[maId].asgn[di]={};
    ed[maId].asgn[di].isWABkp=true;ed[maId].asgn[di].hasBelegt=true;
    ed[maId].cntBkpWerk++;days[di].waBkp=maId;
  }

  function score(maId,di){
    const e=ed[maId];
    return -(e.soll-e.cnt24h)*100+(e.pref.includes(days[di].dow)?-10:0)+e.lastDay;
  }

  for(let di=0;di<dim;di++){
    const day=days[di];
    if(day.type==='werkstatt'){
      const waCands=mas.filter(ma=>canAssignWABkp(ma.id,di)).sort((a,b)=>score(a.id,di)-score(b.id,di));
      if(waCands.length) setWABkp(waCands[0].id,di);
      const hCands=mas.filter(ma=>canAssignDienst(ma.id,di)).sort((a,b)=>score(a.id,di)-score(b.id,di));
      if(hCands.length) setHaupt(hCands[0].id,di);
      const bCands=mas.filter(ma=>canAssignBackup(ma.id,di)&&ma.id!==day.hauptD).sort((a,b)=>score(a.id,di)-score(b.id,di));
      if(bCands.length) setBackup(bCands[0].id,di);
    } else {
      const prefH=mas.filter(ma=>ed[ma.id].pref.includes(day.dow)&&canAssignDienst(ma.id,di)).sort((a,b)=>score(a.id,di)-score(b.id,di));
      if(prefH.length) setHaupt(prefH[0].id,di);
      if(!day.hauptD){
        const hCands=mas.filter(ma=>canAssignDienst(ma.id,di)).sort((a,b)=>score(a.id,di)-score(b.id,di));
        if(hCands.length) setHaupt(hCands[0].id,di);
      }
      if(!day.backupD){
        const bCands=mas.filter(ma=>canAssignBackup(ma.id,di)&&ma.id!==day.hauptD).sort((a,b)=>score(a.id,di)-score(b.id,di));
        if(bCands.length) setBackup(bCands[0].id,di);
      }
    }
  }

  const plan=getOrInitPlan();
  const overrides=plan.manualOverrides||[];
  plan.days=days;
  overrides.forEach(ov=>{
    const di=ov.dayIdx;
    if(di>=0&&di<days.length){
      if(ov.field==='hauptD') days[di].hauptD=ov.maId;
      if(ov.field==='backupD') days[di].backupD=ov.maId;
      if(ov.field==='waBkp') days[di].waBkp=ov.maId;
    }
  });
  ST.plans[planKey()]=plan;
  autoSave('Plan generiert: '+fmtMonthDisp(mk));
  showBanner();
  renderSKOverview();
  renderPlanTable();
}

function parsePrefDays(txt){
  const map={montag:1,dienstag:2,mittwoch:3,donnerstag:4,freitag:5,samstag:6,sonntag:0,mo:1,di:2,mi:3,do:4,fr:5,sa:6,so:0};
  const low=txt.toLowerCase();const res=[];
  Object.keys(map).forEach(k=>{if(low.includes(k)) res.push(map[k]);});
  return res;
}

function doUndo(){
  if(!undoStack.length) return;
  const snap=undoStack.pop();
  ST.plans[planKey()]=snap||{days:[],manualOverrides:[]};
  autoSave('Rückgängig gemacht');
  if(!undoStack.length) document.getElementById('btn-undo').disabled=true;
  renderSKOverview();renderPlanTable();
}

function renderPlanTable(){
  const wrap=document.getElementById('plan-table-wrap');if(!wrap) return;
  const mk=ST.aktiverMonat;
  const t=activeTeam();const mas=t?t.mitarbeitende:[];
  const dim=daysInMonth(mk);
  const plan=getOrInitPlan();const days=plan.days||[];
  const ei=ST.einstellungen;

  if(!mas.length){wrap.innerHTML='<div class="empty-state"><div class="icon">📋</div><p>Keine Mitarbeitenden. Bitte zuerst Stammdaten anlegen.</p></div>';
    document.getElementById('soll-ist-wrap').innerHTML='';document.getElementById('viol-wrap').innerHTML='';return;}

  // Build vac/sper sets
  const vacSets={},sperSets={};
  mas.forEach(ma=>{vacSets[ma.id]=buildVacSet(ma,mk);sperSets[ma.id]=buildSperSet(ma,mk);});

  // Termine indexed by date
  const terminByDate={};
  const termine=getTeamTermine(mk);
  termine.forEach(tr=>{if(!terminByDate[tr.datum])terminByDate[tr.datum]=[];terminByDate[tr.datum].push(tr);});

  function maPill(maId,badge){
    const ma=findMA(t.id,maId);if(!ma) return '';
    const noFS=!ma.fuehrerschein?' 🚫🚗':'';
    return `<span class="ma-pill" style="background:${maColor(ma)}" onclick="openCellDDList(event)"
      title="${ma.vorname} ${ma.nachname}${noFS}">${ma.vorname} ${ma.nachname[0]}.${noFS}<sup>${badge}</sup></span>`;
  }
  function vacPills(di){
    const ds=dayStr(mk,di+1);
    return mas.filter(ma=>vacSets[ma.id].has(ds)).map(ma=>`<span class="ma-pill-small" style="background:${maColor(ma)}" title="Urlaub">${maKuerzel(ma)}</span>`).join('');
  }
  function sperrPills(di){
    const ds=dayStr(mk,di+1);
    return mas.filter(ma=>sperSets[ma.id].has(ds)).map(ma=>`<span class="ma-pill-small" style="background:${maColor(ma)};opacity:.6" title="Sperrtag">${maKuerzel(ma)}</span>`).join('');
  }

  let rows='';
  for(let di=0;di<dim;di++){
    const ds=dayStr(mk,di+1);
    const dow=new Date(ds).getDay();
    const we=isWE(ds),hol=isHol(ds);
    const day=days[di]||{};
    const dayType=day.type||(ei.werkstatttage.includes(dow)?'werkstatt':ei.freischichttage.includes(dow)?'freischicht':'normal');
    const dateLabel=`<strong>${String(di+1).padStart(2,'0')}.${mk.split('-')[1]}.</strong> ${DOW_DE[dow]}`;
    const dateCell=`<td class="td-date${hol?' hol-date':''}" rowspan="${dayType==='werkstatt'?2:1}" title="${holName(ds)||''}">${dateLabel}${hol?`<br><span style="font-size:9px">${holName(ds)}</span>`:''}</td>`;
    const vpills=vacPills(di);const spills=sperrPills(di);
    const vacSpanCell=`<td class="td-avail" rowspan="${dayType==='werkstatt'?2:1}">${vpills}</td>`;
    const sperrSpanCell=`<td class="td-avail" rowspan="${dayType==='werkstatt'?2:1}">${spills}</td>`;

    // Insert termin rows before this day
    if(terminByDate[ds]){
      terminByDate[ds].forEach(tr=>{
        const avail=mas.filter(ma=>!vacSets[ma.id].has(ds)&&!sperSets[ma.id].has(ds));
        rows+=`<tr class="r-termin">
          <td class="td-date" style="color:#7c3aed">📌 ${dateLabel}</td>
          <td class="td-desc"><span class="termin-badge" style="background:${tr.farbe||'#534AB7'}">${esc(tr.name)}</span> ${tr.von}–${tr.bis}</td>
          <td colspan="2" class="td-avail" style="font-size:10px">Verfügbar: ${avail.map(ma=>`<span class="ma-pill-small" style="background:${maColor(ma)}">${maKuerzel(ma)}</span>`).join('')||'–'}</td>
          <td class="td-avail"></td><td class="td-avail"></td>
        </tr>`;
      });
    }

    const ns=ei.schichtzeiten.normal,wa=ei.schichtzeiten.werkstattA,fa=ei.schichtzeiten.freischichtA;

    if(dayType==='werkstatt'){
      const trCls='r-werk-a'+(we?' r-we':'')+(hol?' r-hol':'');
      rows+=`<tr class="${trCls}">
        ${dateCell}
        <td class="td-desc" style="color:var(--cyan)">🔧 Block A &nbsp;<small>${wa.start}–${wa.end}</small></td>
        <td class="td-assign">–</td>
        <td class="td-assign">${day.waBkp?maPill(day.waBkp,'W'):`<span style="color:#ccc;font-size:11px" onclick="openCellDDByDi(event,${di},'waBkp')">+ W</span>`}</td>
        ${vacSpanCell}${sperrSpanCell}
        <td></td>
      </tr>
      <tr class="r-werk-b${we?' r-we':''}${hol?' r-hol':''}">
        <td class="td-desc" style="color:var(--navy)">🔧 Block B &nbsp;<small>${wa.end}–${ns.end}</small></td>
        <td class="td-assign">${day.hauptD?maPill(day.hauptD,'D'):`<span style="color:#ccc;font-size:11px" onclick="openCellDDByDi(event,${di},'hauptD')">+ D</span>`}</td>
        <td class="td-assign">${day.backupD?maPill(day.backupD,'B'):`<span style="color:#ccc;font-size:11px" onclick="openCellDDByDi(event,${di},'backupD')">+ B</span>`}</td>
      </tr>`;
    } else {
      let descLabel,trCls;
      if(dayType==='freischicht'){
        descLabel=`🌅 Freischicht &nbsp;<small>${fa.start}–${ns.end}</small>`;trCls='r-frei';
      } else {
        descLabel=`🌙 24h-Dienst &nbsp;<small>${ns.start}–${ns.end}</small>`;trCls='r-norm';
      }
      if(we) trCls+=' r-we';if(hol) trCls+=' r-hol';
      rows+=`<tr class="${trCls}">
        ${dateCell}
        <td class="td-desc">${descLabel}</td>
        <td class="td-assign">${day.hauptD?maPill(day.hauptD,'D'):`<span style="color:#ccc;font-size:11px" onclick="openCellDDByDi(event,${di},'hauptD')">+ D</span>`}</td>
        <td class="td-assign">${day.backupD?maPill(day.backupD,'B'):`<span style="color:#ccc;font-size:11px" onclick="openCellDDByDi(event,${di},'backupD')">+ B</span>`}</td>
        ${vacSpanCell}${sperrSpanCell}
        <td></td>
      </tr>`;
    }
  }

  wrap.innerHTML=`<table class="plan-list">
    <thead><tr>
      <th style="min-width:85px">Datum</th>
      <th style="min-width:160px">Schicht</th>
      <th style="min-width:110px">Dienst (D)</th>
      <th style="min-width:110px">Backup (B)</th>
      <th style="min-width:80px">Urlaub</th>
      <th style="min-width:80px">Sperrtage</th>
      <th style="min-width:40px"></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  renderSollIst(mas,days,mk);
  renderViolations(mas,days,mk,dim);
}

function openCellDDList(evt){
  evt.stopPropagation();
  // Find the closest row to determine di and field
}

function openCellDDByDi(evt,di,field){
  evt.stopPropagation();
  const mk=ST.aktiverMonat;const t=activeTeam();const mas=t?t.mitarbeitende:[];
  const plan=getOrInitPlan();const days=plan.days||[];const day=days[di]||{};
  const ds=dayStr(mk,di+1);
  const dd=document.getElementById('cell-dd');

  const labels={hauptD:'Haupt-Dienst (D)',backupD:'Backup (B)',waBkp:'Werkstatt-Bkp (W)'};
  let html=`<div class="cell-dd-title">${String(di+1).padStart(2,'0')}.${mk.split('-')[1]}. – ${labels[field]}</div>`;
  html+=`<div class="cell-dd-item" onclick="setCellField(${di},'${field}',null)">
    <div class="cell-dd-kuerzel" style="background:#aaa">–</div><span>Niemand ${day[field]===null||day[field]===undefined?'✓':''}</span></div>`;
  mas.forEach(ma=>{
    const vacSet=buildVacSet(ma,mk);const sperSet=buildSperSet(ma,mk);
    const avail=!vacSet.has(ds)&&!sperSet.has(ds);
    const isCur=day[field]===ma.id;
    html+=`<div class="cell-dd-item ${avail?'':'unavail'}" onclick="${avail?`setCellField(${di},'${field}','${ma.id}')`:''}" >
      <div class="cell-dd-kuerzel" style="background:${maColor(ma)}">${maKuerzel(ma)}</div>
      <span>${ma.vorname} ${ma.nachname} ${isCur?'✓':''}${!avail?' (N/V)':''}</span>
    </div>`;
  });
  html+=`<div style="padding:6px 12px;border-top:1px solid var(--border)"><button class="btn btn-xs btn-sec" onclick="document.getElementById('cell-dd').classList.remove('show')">Schließen</button></div>`;
  dd.innerHTML=html;
  const r=evt.target.getBoundingClientRect();
  let top=r.bottom+2,left=r.left;
  if(top+320>window.innerHeight) top=r.top-320;
  if(left+230>window.innerWidth) left=window.innerWidth-235;
  dd.style.top=top+'px';dd.style.left=left+'px';
  dd.classList.add('show');
}

function setCellField(di,field,maId){
  const plan=getOrInitPlan();
  if(!plan.days[di]) plan.days[di]={};
  undoStack.push(JSON.parse(JSON.stringify(plan)));
  document.getElementById('btn-undo').disabled=false;
  plan.days[di][field]=maId;
  if(!plan.manualOverrides) plan.manualOverrides=[];
  plan.manualOverrides=plan.manualOverrides.filter(o=>!(o.dayIdx===di&&o.field===field));
  if(maId!==null) plan.manualOverrides.push({dayIdx:di,field,maId});
  autoSave('Manuelle Änderung');
  document.getElementById('cell-dd').classList.remove('show');
  renderPlanTable();
}

function renderSollIst(mas,days,mk){
  const wrap=document.getElementById('soll-ist-wrap');if(!wrap) return;
  let html=`<div class="card"><div class="ch"><h3>📊 Soll/Ist-Vergleich</h3></div><div class="cb" style="overflow:auto">
  <table class="sum-tbl"><thead><tr><th>Mitarbeiter/in</th><th>Soll</th><th>Haupt-D</th><th>Backup</th><th>Werk-W</th><th>Gesamt</th><th>Stundenkonto</th></tr></thead><tbody>`;
  mas.forEach(ma=>{
    const md=ma.monatsdaten&&ma.monatsdaten[mk];
    const soll=(md&&md.sollDienste)||0;const sk=(md&&md.stundenkonto)||0;
    let haupt=0,backup=0,werk=0;
    days.forEach(day=>{
      if(day.hauptD===ma.id) haupt++;
      if(day.backupD===ma.id) backup++;
      if(day.waBkp===ma.id) werk++;
    });
    const gesamt=haupt+backup;const diff=gesamt-soll;
    const cls=diff>1?'sum-err':diff<-1?'sum-warn':'sum-ok';
    const skCls=sk>0?'sum-warn':sk<0?'sum-err':'';
    html+=`<tr>
      <td style="display:flex;align-items:center;gap:6px"><span class="ma-pill" style="background:${maColor(ma)}">${ma.vorname} ${ma.nachname[0]}.</span>${!ma.fuehrerschein?'🚫🚗':''}</td>
      <td>${soll}</td><td>${haupt}</td><td>${backup}</td><td>${werk}</td>
      <td class="${cls}">${gesamt} (${diff>=0?'+':''}${diff})</td>
      <td class="${skCls}">${sk!==0?(sk>0?'+':'')+sk+'h':'–'}</td>
    </tr>`;
  });
  html+='</tbody></table></div></div>';
  wrap.innerHTML=html;
}

function renderViolations(mas,days,mk,dim){
  const wrap=document.getElementById('viol-wrap');if(!wrap) return;
  const violations=[];
  const asgn={};mas.forEach(ma=>{asgn[ma.id]={};});
  days.forEach((day,di)=>{
    if(day.hauptD){if(!asgn[day.hauptD])asgn[day.hauptD]={};asgn[day.hauptD][di]={hasHaupt:true,hasBelegt:true};}
    if(day.backupD){if(!asgn[day.backupD])asgn[day.backupD]={};if(!asgn[day.backupD][di])asgn[day.backupD][di]={};asgn[day.backupD][di].hasBackup=true;asgn[day.backupD][di].hasBelegt=true;}
    if(day.waBkp){if(!asgn[day.waBkp])asgn[day.waBkp]={};if(!asgn[day.waBkp][di])asgn[day.waBkp][di]={};asgn[day.waBkp][di].isWABkp=true;asgn[day.waBkp][di].hasBelegt=true;}
  });
  const g=(maId,di)=>asgn[maId]&&asgn[maId][di]||{};
  mas.forEach(ma=>{
    const vs=buildVacSet(ma,mk),ss=buildSperSet(ma,mk);
    days.forEach((day,di)=>{
      const ds=day.ds;
      if(day.hauptD===ma.id||day.backupD===ma.id){
        if(vs.has(ds)) violations.push({rule:'H1',ma:`${ma.vorname} ${ma.nachname}`,day:fmtDisp(ds),desc:'Dienst an Urlaubstag'});
        if(ss.has(ds)) violations.push({rule:'H1',ma:`${ma.vorname} ${ma.nachname}`,day:fmtDisp(ds),desc:'Dienst an Sperrtag'});
      }
      if(day.hauptD===ma.id){
        if(di>0&&g(ma.id,di-1).hasHaupt) violations.push({rule:'H2',ma:`${ma.vorname} ${ma.nachname}`,day:fmtDisp(ds),desc:'Aufeinanderfolgende Haupt-Dienste'});
        if(di>=2&&g(ma.id,di-1).hasBelegt&&g(ma.id,di-2).hasBelegt) violations.push({rule:'H3',ma:`${ma.vorname} ${ma.nachname}`,day:fmtDisp(ds),desc:'3 Dienste in Folge'});
      }
    });
  });
  if(!violations.length){wrap.innerHTML='<div class="alert alert-ok">✓ Alle Regeln eingehalten.</div>';return;}
  let html=`<div class="card"><div class="ch"><h3>⚠ Regelprüfung</h3><span style="font-size:12px;color:var(--red)">${violations.length} Verstoß/Verstöße</span></div><div class="cb">`;
  violations.forEach(v=>{html+=`<div class="viol-item"><span class="viol-icon">❌</span><div><strong>${v.rule}</strong> · <em>${v.ma}</em> · ${v.day} – ${v.desc}</div></div>`;});
  html+='</div></div>';
  wrap.innerHTML=html;
}

function readImportFile(f){
  if(!f) return;
  const r=new FileReader();
  r.onload=e=>{try{mergeImport(JSON.parse(e.target.result));}catch(err){alert('Fehler: '+err.message);}};
  r.readAsText(f);
}

function mergeImport(data){
  if(!data.teams){alert('Ungültiges Format.');return;}
  let added=0;
  data.teams.forEach(imp=>{
    const existing=findTeam(imp.id);
    if(!existing){ST.teams.push(imp);added++;}
    else{(imp.mitarbeitende||[]).forEach(iMa=>{if(!existing.mitarbeitende.find(m=>m.id===iMa.id)){existing.mitarbeitende.push(iMa);added++;}});}
  });
  autoSave(`Import: ${added} neue Einträge`);
  alert(`Import: ${added} neue Einträge hinzugefügt.`);
  renderTopbar();renderSidebar('sb-stamm');renderSidebar('sb-monat');renderSaveTab();
}

// ─── FULL RENDER ───
function renderAll(){
  renderTopbar();
  renderSidebar('sb-stamm');renderSidebar('sb-monat');
  if(activeTab==='stamm') renderMADetail();
  if(activeTab==='monat') renderMonatDetail();
  if(activeTab==='plan') renderPlanTab();
  if(activeTab==='save') renderSaveTab();
}

// Close cell dropdown on outside click
document.addEventListener('click',e=>{
  const dd=document.getElementById('cell-dd');
  if(dd&&dd.classList.contains('show')&&!dd.contains(e.target)) dd.classList.remove('show');
});

// ─── BOOT ───
loadState();
renderAll();
</script>
</body>
